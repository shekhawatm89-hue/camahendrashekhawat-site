<style>
/* Layout: one screen at a time, like a phone app. A single answer-sheet card per screen, red margin line on the left. */
:root{
  --paper:#f3f6fc; --sheet:#ffffff; --ink:#18264a; --muted:#5f6b86; --rule:#e1e7f2; --rule-strong:#c4cee2;
  --accent:#2445a8; --accent-ink:#ffffff; --accent-soft:#e7ecfa; --margin:#d4405a;
  --acc:#2445a8; --acc-soft:#e6ebfa; --bs:#0f7a6c; --bs-soft:#dff3ef; --eco:#9a5506; --eco-soft:#fbeedc;
  --good:#1d7a45; --good-soft:#e2f4e8; --warn:#8a5a00; --warn-soft:#fdf0d2; --bad:#b4233c; --bad-soft:#fbe6ea; --today:#fff6cc; --today-line:#e0b400;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0b1120; --sheet:#141c30; --ink:#e4e9f5; --muted:#9aa6c2; --rule:#25304a; --rule-strong:#3a4766;
  --accent:#93a9ff; --accent-ink:#0b1120; --accent-soft:#1e2a4d; --margin:#ff7d93;
  --acc:#93a9ff; --acc-soft:#1e2a4d; --bs:#5fd0bd; --bs-soft:#123630; --eco:#f0b25c; --eco-soft:#3a2a12;
  --good:#6fd697; --good-soft:#143323; --warn:#f2c065; --warn-soft:#3a2d10; --bad:#ff8fa2; --bad-soft:#3d1820; --today:#332d10; --today-line:#c9a227; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b1120; --sheet:#141c30; --ink:#e4e9f5; --muted:#9aa6c2; --rule:#25304a; --rule-strong:#3a4766;
  --accent:#93a9ff; --accent-ink:#0b1120; --accent-soft:#1e2a4d; --margin:#ff7d93;
  --acc:#93a9ff; --acc-soft:#1e2a4d; --bs:#5fd0bd; --bs-soft:#123630; --eco:#f0b25c; --eco-soft:#3a2a12;
  --good:#6fd697; --good-soft:#143323; --warn:#f2c065; --warn-soft:#3a2d10; --bad:#ff8fa2; --bad-soft:#3d1820; --today:#332d10; --today-line:#c9a227; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;max-width:860px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px}
.brand-av{width:32px;height:32px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--sheet),0 0 0 3.5px var(--accent)}
.sir{display:flex;align-items:center;gap:14px}
.sir img{width:88px;height:88px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--accent)}
.sir b{font-family:var(--f-display);font-size:1.2rem;display:block}
.sir span{font-size:.92rem}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:8px 64px}
.narrow{max-width:660px;margin:0 auto}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:10px;padding:11px 18px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:14px 22px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:6px 12px;font-size:.92rem}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:26px 24px 26px 40px;position:relative}
.card::before{content:"";position:absolute;left:22px;top:18px;bottom:18px;width:2px;background:var(--margin);opacity:.5;border-radius:1px}
@media (max-width:560px){.card{padding:20px 16px 20px 30px}.card::before{left:14px}}
.stack{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--margin);font-weight:700}

/* Welcome */
.hero{display:flex;flex-direction:column;gap:12px;padding:20px 0 8px}
.hero p{max-width:56ch;font-size:1.08rem}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.how li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--rule)}
.how li:first-child{border-top:0;padding-top:0}
.how .num{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.how b{display:block;font-size:1.05rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Form */
.stepinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.92rem;color:var(--muted);margin-bottom:8px}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:18px}
.progress span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.example{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.95rem;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-head{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.sec-head .help{white-space:pre-line}
.field{display:flex;flex-direction:column;gap:9px;padding:18px 0;border-top:1px dashed var(--rule)}
.field:first-of-type{border-top:0}
.field>label,.field>.lbl{font-weight:700;font-size:1.02rem}
.req{color:var(--margin)}
.fhelp{font-size:.92rem;color:var(--muted);margin-top:-4px}
.err{color:var(--bad);font-size:.93rem;font-weight:600}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],select,textarea{
  font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule-strong);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
select{max-width:220px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{border:1px solid var(--rule-strong);border-radius:999px;padding:7px 14px;font-size:.95rem;background:var(--sheet);transition:background .12s,border-color .12s}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.grow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--rule)}
.grow:first-child{border-top:0;padding-top:4px}
.grow .rl{font-weight:600}
.grow .rl small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
.scale{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.form-nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px;padding-top:18px;border-top:1px solid var(--rule)}

/* How it was made */
.explain{display:flex;flex-direction:column;gap:14px}
.ex{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px}
.ex .num{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;display:flex;align-items:center;justify-content:center}
.ex .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.sum{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:1rem}
.sum .box{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:6px 10px}
.sum .box b{font-family:var(--f-mono)}
.sum .op{color:var(--muted);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl td{padding:6px 0;border-top:1px solid var(--rule)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right;font-family:var(--f-mono)}
.result{border-radius:10px;padding:14px 16px;font-size:1.02rem}
.result.good{background:var(--good-soft)} .result.bad{background:var(--bad-soft)}
.result b{font-family:var(--f-display)}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.phases li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.phases li:first-child{border-top:0}
.phases .dot{width:12px;height:12px;border-radius:50%}
.phases .when{font-size:.92rem;color:var(--muted);text-align:right}
@media (max-width:520px){.phases li{grid-template-columns:14px minmax(0,1fr)}.phases .when{grid-column:2;text-align:left}}

/* Timetable */
.tt-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.today{background:var(--today);border:1px solid var(--today-line);border-radius:14px;padding:20px}
.today h2{font-size:1.3rem}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) 46px;gap:10px;padding:11px 0;border-top:1px solid var(--rule);align-items:start}
.today .task{border-top-color:color-mix(in srgb, var(--today-line) 35%, transparent)}
.task:first-child{border-top:0}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--good)}
.task .what{display:flex;flex-direction:column;gap:3px;min-width:0}
.task .ch{font-weight:700}
.task .tx{font-size:.95rem;color:var(--muted)}
.task .h{text-align:right;font-family:var(--f-mono);font-size:.92rem}
.task.done .ch,.task.done .tx{text-decoration:line-through;opacity:.55}
.sub{align-self:flex-start;font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 7px}
.sub-Accountancy{background:var(--acc-soft);color:var(--acc)} .sub-Business{background:var(--bs-soft);color:var(--bs)}
.sub-Economics{background:var(--eco-soft);color:var(--eco)} .sub-All{background:var(--rule);color:var(--ink)}
.weeknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weeknav strong{font-family:var(--f-display);font-size:1.15rem}
.day{display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--rule)}
.day:first-child{border-top:0}
.day.is-today .dd{color:var(--today-line)}
.day .dn{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.day .dd{font-family:var(--f-display);font-size:1.2rem;font-weight:700;line-height:1.1}
.day .dh{font-size:.82rem;color:var(--muted)}
@media (max-width:560px){.day{grid-template-columns:minmax(0,1fr);gap:4px}.day .dt{display:flex;gap:10px;align-items:baseline}}
.overdue{color:var(--bad);font-weight:700;font-size:.85rem}

/* Check-in + mentor */
.done-panel{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:20px 0}
.tick{width:64px;height:64px;border-radius:50%;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700}
.streak{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:10px}
.streak div{aspect-ratio:1;border-radius:4px;background:var(--rule);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-family:var(--f-mono)}
.streak .ok{background:var(--good);color:var(--sheet)} .streak .miss{background:var(--bad);color:var(--sheet)} .streak .now{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.report{white-space:pre-wrap;font-size:.95rem;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px;max-height:360px;overflow:auto}
.log{border-top:1px solid var(--rule);padding:9px 0;font-size:.95rem}
.log:first-of-type{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
/* Marks, units, task editor, 7-day view */
.mrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--rule)}
.mrow:first-child{border-top:0;padding-top:4px}
.mrow .rl{font-weight:600}
.mins{display:flex;align-items:center;gap:8px}
.mins input{width:76px;text-align:center}
.mins .pct{min-width:58px;font-weight:700;color:var(--accent)}
.unit{margin-top:10px}
.unit:first-child{margin-top:0}
.unit-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-weight:700;font-family:var(--f-display)}
.unit-m{font-family:var(--f-body);font-weight:600;font-size:.88rem;color:var(--accent)}
.unit .grow{padding-left:4px}
.mine{align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--good);background:var(--good-soft);border-radius:4px;padding:1px 7px}
.linkbtn.small{font-size:.9rem;align-self:flex-start;padding:2px 0}
.editor{display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--rule-strong);border-radius:10px;padding:12px;margin-top:6px}
.editor label{display:flex;flex-direction:column;gap:4px;font-size:.92rem;font-weight:600}
.editor select{max-width:none}
.editor input{max-width:140px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.tiles3{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px}
.tile .k{font-size:.85rem;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.tile .s{font-size:.82rem;color:var(--muted)}
.loadrow{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:10px;align-items:center;margin-top:10px;font-size:.95rem}
.loadrow .mono{text-align:right}
.loadbar{height:12px;background:var(--rule);border-radius:6px;overflow:hidden}
.loadbar span{display:block;height:100%}
.wk-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.wk-item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:.95rem}
.mark{font-weight:700;text-align:center}
.mark.yes{color:var(--good)} .mark.no{color:var(--bad)}
.wk-note{font-size:.9rem;background:var(--paper);border-radius:8px;padding:6px 10px}
.wk-note.miss{color:var(--bad);font-weight:600}

/* App: labels, day navigator, planner, mentor list */
.lab{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:.85rem;font-weight:700}
.lab::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.lab.green{background:var(--good-soft);color:var(--good)} .lab.yellow{background:var(--warn-soft);color:var(--warn)}
.lab.red{background:var(--bad-soft);color:var(--bad)} .lab.new{background:var(--accent-soft);color:var(--accent)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.daynav .mid{text-align:center;display:flex;flex-direction:column}
.daynav .mid b{font-family:var(--f-display);font-size:1.3rem}
.navbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--sheet);font-size:1.3rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.navbtn:disabled{opacity:.35;cursor:default}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.menu{grid-template-columns:minmax(0,1fr)}}
.menu button{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.menu button b{font-family:var(--f-display);font-size:1.05rem}
.menu button span{font-size:.88rem;color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--rule);align-items:start}
.item:first-child{border-top:0}
.item input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--good)}
.item .it-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.item .it-m{font-family:var(--f-mono);font-size:.88rem;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
.item.done .it-main{text-decoration:line-through;opacity:.55}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 4px}
.pday{border-top:1px solid var(--rule);padding:14px 0}
.pday:first-of-type{border-top:0;padding-top:4px}
.pday-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:4px}
.pday-h b{font-family:var(--f-display);font-size:1.1rem}
.pday-h .free{font-size:.88rem;color:var(--muted)}
.pday-h .free.over{color:var(--bad);font-weight:700}
.adder{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--paper);border:1px solid var(--rule-strong);border-radius:12px;padding:12px;margin-top:8px}
@media (max-width:560px){.adder{grid-template-columns:minmax(0,1fr)}}
.adder label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:600}
.adder select{max-width:none}
.adder .calc{grid-column:1/-1;font-weight:700;color:var(--accent)}
.adder .actions{grid-column:1/-1}
.needrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.needrow span{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:5px 10px;font-size:.95rem}
.pace{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:10px 0;border-top:1px solid var(--rule)}
.pace:first-of-type{border-top:0}
.pace .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pace .f{font-size:.92rem}
.pace .f.late{color:var(--bad);font-weight:700} .pace .f.ok{color:var(--good);font-weight:700}
.savebar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-weight:600}
.savebar .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.chlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 56px;gap:10px;align-items:center;font-size:.92rem}
.chrow .loadbar{height:8px}
.chrow .mono{text-align:right}
.srow{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet)}
.srow .nm{font-weight:700;font-size:1.05rem}
.srow .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.9rem;color:var(--muted)}
.srow .meta .bad{color:var(--bad);font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:6px 14px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr)}.kv dd{margin-bottom:6px}}
.loading{opacity:.6;pointer-events:none}
.pinbox{font-family:var(--f-mono);letter-spacing:.4em;max-width:140px!important;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// =====================================================================
// Time rules: how long each kind of target takes
// =====================================================================
const PER_Q = (subject, kind) => subject==='Accountancy' ? 10 : (subject==='Economics' && kind==='num' ? 6 : 8);
const ANSWER_MIN = 8;
const ACTS = {
  lecture:  {label:'Watch lecture',   unit:'minutes',   ph:'Lecture length, e.g. 60'},
  notes:    {label:'Make notes',      unit:'minutes',   ph:'e.g. 45'},
  questions:{label:'Solve questions', unit:'questions', ph:'e.g. 20'},
  answers:  {label:'Write answers',   unit:'answers',   ph:'e.g. 5'},
  revise:   {label:'Revise',          unit:'minutes',   ph:'e.g. 30'},
  test:     {label:'Test',            unit:'minutes',   ph:'e.g. 45'},
};
const CHAP = {}; SYL.forEach(c => CHAP[c.chapter] = c);
function itemMinutes(it){
  const q = +it.qty || 0;
  if (it.activity==='questions') return q * PER_Q(it.subject, (CHAP[it.chapter]||{}).kind);
  if (it.activity==='answers') return q * ANSWER_MIN;
  return q;
}
function itemText(it){
  const q = +it.qty || 0, ch = it.chapter;
  if (!ch) return it.activity==='test' ? `Weekly test on this week's chapters (${q} min, closed book)` : ACTS[it.activity].label;
  return ({ lecture:`Watch ${q} min of lecture: ${ch}`, notes:`Make notes: ${ch}`, questions:`Solve ${q} questions: ${ch}`,
    answers:`Write ${q} board-style answers: ${ch}`, revise:`Revise: ${ch}`, test:`Test (${q} min): ${ch}` })[it.activity];
}
const fmtMin = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`; };
const fmtH = m => (Math.round(m/6)/10) + ' h';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

// =====================================================================
// Weeks run Sunday to Saturday. The joining week starts on the joining day.
// =====================================================================
const sundayOf = d => addDays(d, -d.getDay());
const daysBetween = (a,b) => Math.round((b - a) / 864e5);
const eachDay = (a,b) => { const out = []; for (let d = new Date(a); d <= b; d = addDays(d,1)) out.push(new Date(d)); return out; };
function weekOf(d, joined){ const s = sundayOf(d); return {start: s < joined ? new Date(joined) : s, end: addDays(s,6), key: ymd(s)}; }

// =====================================================================
// Student model: what is left, pace, forecast, label
// =====================================================================
function buildModel(state){
  const a = state.profile.answers || {};
  const joined = D(state.profile.joined) || today0();
  const t = today0();
  const marks = {}; SUBJECTS.forEach(s => marks[s] = pctOf((a.latest||{})[s]) ?? pctOf((a.class11||{})[s]) ?? 65);
  const items = (state.items||[]).map(it => Object.assign({}, it, {d: D(it.date), min: itemMinutes(it)}));
  const doneMin = {}; items.forEach(it => { if (it.done && it.chapter) doneMin[it.chapter] = (doneMin[it.chapter]||0) + it.min; });
  const chapters = SUBJECTS.flatMap(s => chaptersOf(s, a.accOption).map(c => {
    let st = STATUSES.indexOf(((a['ch_'+s])||{})[c.chapter]); if (st < 0) st = 0;
    const weak = marks[s] < 60, total = Math.round(c.base*60*FACTOR[st]*(weak?1.15:1)), done = doneMin[c.chapter]||0;
    return Object.assign({}, c, {status:st, weak, total, done, rem: Math.max(0, total-done)});
  }));
  const remBy = {}, totalBy = {};
  SUBJECTS.forEach(s => { const cs = chapters.filter(c => c.subject===s); remBy[s] = cs.reduce((x,c)=>x+c.rem,0); totalBy[s] = cs.reduce((x,c)=>x+c.total,0); });
  const target = t <= addDays(D(CFG.coverageEnd),-7) ? D(CFG.coverageEnd) : addDays(D(CFG.boardStart),-21);
  const from = new Date(Math.max(addDays(t,-14), joined)), span = Math.max(1, daysBetween(from, t));
  const paceBy = {}; SUBJECTS.forEach(s => paceBy[s] = items.filter(it => it.done && it.subject===s && it.d>=from && it.d<t).reduce((x,it)=>x+it.min,0) / span);
  return { state, a, joined, t, marks, items, chapters, remBy, totalBy, target, paceBy, paceDays:span,
    hrs: {wd:+a.weekdayHrs||3, sat:+a.satHrs||5, sun:+a.sunHrs||6},
    name: state.profile.name || a.name || 'Student', phone: state.profile.phone, checkins: state.checkins||[] };
}
const availMin = (m, d) => (d.getDay()===0 ? m.hrs.sun : d.getDay()===6 ? m.hrs.sat : m.hrs.wd) * 60;
function forecast(rem, perDay, t){ if (rem <= 0) return {done:true}; if (!perDay) return {none:true}; const days = Math.ceil(rem/perDay), b = D(CFG.boardStart); if (days > daysBetween(t, b)) return {date: addDays(b, 1), after:true}; return {date: addDays(t, days)}; }
const fd = f => f.after ? 'after the board exams' : fmt(f.date), fdY = f => f.after ? 'after the board exams' : fmtY(f.date);
function weekStats(m, wk){
  const its = m.items.filter(it => it.d>=wk.start && it.d<=wk.end);
  const planned = its.reduce((x,i)=>x+i.min,0), done = its.filter(i=>i.done).reduce((x,i)=>x+i.min,0);
  const by = {}; SUBJECTS.forEach(s => by[s] = {plan:0, done:0});
  its.forEach(i => { if (by[i.subject]) { by[i.subject].plan += i.min; if (i.done) by[i.subject].done += i.min; } });
  const days = eachDay(wk.start, wk.end);
  const past = days.filter(d => d <= m.t);
  const ci = past.filter(d => m.checkins.some(c => c.date===ymd(d))).length;
  return {its, planned, done, by, days, past, ci, count: its.length, countDone: its.filter(i=>i.done).length};
}
function needThisWeek(m, wk){
  const start = wk.start < m.t ? m.t : wk.start;
  const daysIn = Math.max(1, daysBetween(start, wk.end)+1), left = Math.max(daysIn, daysBetween(start, m.target)+1);
  const out = {}; SUBJECTS.forEach(s => out[s] = m.remBy[s] * Math.min(1, daysIn/left)); return out;
}
function missedStreak(m){ let n = 0; for (let d = addDays(m.t,-1); d >= m.joined; d = addDays(d,-1)){ if (m.checkins.some(c => c.date===ymd(d))) break; n++; } return n; }
function statusLabel(m){
  const from = new Date(Math.max(addDays(m.t,-7), m.joined));
  const recent = m.items.filter(i => i.d>=from && i.d<m.t);
  if (daysBetween(m.joined, m.t) < 2 && !recent.length) return {k:'new', text:'Just joined', why:'Not enough days yet to judge the pace.'};
  if (!recent.length) return {k:'red', text:'Far behind', why:'No targets were planned in the last 7 days.'};
  const planned = recent.reduce((x,i)=>x+i.min,0), done = recent.filter(i=>i.done).reduce((x,i)=>x+i.min,0);
  const ratio = planned ? done/planned : 0, pct = Math.round(ratio*100);
  const totalRem = SUBJECTS.reduce((x,s)=>x+m.remBy[s],0), pace = SUBJECTS.reduce((x,s)=>x+m.paceBy[s],0);
  const f = forecast(totalRem, pace, m.t), late = f.done ? -99 : f.none ? 999 : daysBetween(m.target, f.date);
  const finish = f.done ? 'the first pass of the syllabus is done' : f.none ? 'no chapter work is done yet' : 'at this pace the syllabus finishes '+(f.after?'':'on ')+fd(f);
  const why = `${pct}% of the last 7 days' targets done. ${finish[0].toUpperCase()+finish.slice(1)} (target ${fmt(m.target)}).`;
  if (ratio >= .8 && late <= 0) return {k:'green', text:'On track', why, pct, f};
  if (ratio < .5 || late > 21) return {k:'red', text:'Far behind', why, pct, f};
  return {k:'yellow', text:'A little behind', why, pct, f};
}
const labelChip = l => `<span class="lab ${l.k}">${esc(l.text)}</span>`;

// "Fill Sir's suggestion": fills empty days with targets that keep the student on pace.
function suggestDays(m, days, existing){
  const rem = {}; m.chapters.forEach(c => rem[c.chapter] = c.rem);
  existing.filter(i => !i.done && i.chapter).forEach(i => rem[i.chapter] = Math.max(0, (rem[i.chapter]||0) - itemMinutes(i)));
  const credit = {}; SUBJECTS.forEach(s => credit[s] = 0);
  const remS = s => m.chapters.filter(c => c.subject===s).reduce((x,c)=>x+rem[c.chapter],0);
  const out = [], mk = (d,s,ch,act,qty) => out.push({id:uid(), date:ymd(d), subject:s, chapter:ch, activity:act, qty, sugg:true, done:false});
  days.forEach(d => {
    let H = availMin(m, d); if (H < 30) return;
    if (d.getDay()===0 && H >= 90){ mk(d,'All','','test',45); H -= 60; }
    const live = SUBJECTS.filter(s => remS(s) > 0); if (!live.length) return;
    const tot = live.reduce((x,s)=>x+remS(s),0); live.forEach(s => credit[s] += H*remS(s)/tot);
    const picks = live.slice().sort((a,b)=>credit[b]-credit[a]).slice(0, H>=90 ? 2 : 1);
    let shares = [H];
    if (picks.length===2){ const a = Math.max(credit[picks[0]],1), b = Math.max(credit[picks[1]],1); let f = Math.round(H*a/(a+b)/30)*30; f = Math.min(Math.max(f,30), H-30); shares = [f, H-f]; }
    picks.forEach((s,i) => {
      let mins = shares[i];
      const c = m.chapters.find(x => x.subject===s && rem[x.chapter] > 0); if (!c) return;
      const untouched = rem[c.chapter] >= c.total && c.status===0;
      if (untouched && mins >= 60){ const lec = Math.min(60, mins-30); mk(d,s,c.chapter,'lecture',lec); mins -= lec; rem[c.chapter] -= lec; }
      if (c.kind==='num'){ const q = Math.floor(mins/PER_Q(s,c.kind)); if (q>0) mk(d,s,c.chapter,'questions',q); }
      else if (c.status<=1 && untouched){ mk(d,s,c.chapter,'notes',mins); }
      else { const q = Math.floor(mins/ANSWER_MIN); if (q>0) mk(d,s,c.chapter,'answers',q); }
      rem[c.chapter] -= mins; credit[s] -= shares[i];
    });
  });
  return out;
}

  const pub = s => ({profile:{phone:s.phone, name:s.name, joined:s.joined, parentName:s.answers.parentName, parentPhone:s.answers.parentPhone, answers:s.answers}, items:s.items, checkins:s.checkins});
  const byTok = tok => { load(); const s = db.students.find(x => x.token===tok); if (!s) throw new Error('Please log in again.'); return s; };
  function seed(){
    let r = 7; const rnd = () => (r = (r*16807) % 2147483647) / 2147483647;
    const people = [
      {name:'Aarav Mehta', phone:'9876500000', ago:6, hrs:[3,5,6], done:.8, ci:.85, lvl:1, acc:[28,50], miss:0},
      {name:'Riya Sharma', phone:'9876500002', ago:13, hrs:[4,6,6], done:.97, ci:1, lvl:2, acc:[41,50], miss:0},
      {name:'Kabir Singh', phone:'9876500003', ago:13, hrs:[2.5,4,5], done:.62, ci:.75, lvl:1, acc:[30,50], miss:0},
      {name:'Ishaan Gupta', phone:'9876500004', ago:12, hrs:[2,3,4], done:.35, ci:.5, lvl:0, acc:[19,50], miss:3},
    ];
    const t = today0();
    return {students: people.map((p, idx) => {
      const ans = sampleAnswers();
      Object.assign(ans, {name:p.name, phone:p.phone, weekdayHrs:String(p.hrs[0]), satHrs:String(p.hrs[1]), sunHrs:String(p.hrs[2]),
        parentName: idx===0 ? ans.parentName : 'Parent of '+p.name.split(' ')[0], parentPhone:'98765100'+String(idx).padStart(2,'0')});
      ans.latest = Object.assign({}, ans.latest, {Accountancy:{s:String(p.acc[0]), o:String(p.acc[1])}});
      SUBJECTS.forEach(s => chaptersOf(s, ans.accOption).forEach(c => {
        const base = STATUSES.indexOf(ans['ch_'+s][c.chapter]);
        ans['ch_'+s][c.chapter] = STATUSES[Math.max(0, Math.min(4, base + p.lvl - 1))];
      }));
      const st = {phone:p.phone, name:p.name, pin:'1234', token:'demo-'+p.phone, joined:ymd(addDays(t,-p.ago)), answers:ans, items:[], checkins:[]};
      for (let wk = weekOf(D(st.joined), D(st.joined)); wk.start <= t; wk = weekOf(addDays(wk.end,1), D(st.joined))){

        items.forEach(it => { const d = D(it.date); if (d < t && daysBetween(d,t) > p.miss) it.done = rnd() < p.done; });
        st.items = st.items.concat(items);
        eachDay(wk.start, wk.end).filter(d => d < t && daysBetween(d,t) > p.miss).forEach(d => {
          if (rnd() > p.ci) return;
          const di = items.filter(i => i.date===ymd(d)), dn = di.filter(i => i.done);
          const mins = dn.reduce((x,i)=>x+itemMinutes(i),0);
          st.checkins.push({date:ymd(d), hours: Math.round(mins/30)/2, finished: dn.length===di.length ? 'Completed fully' : dn.length ? 'Completed partly' : 'Did not do it',
            what: dn.length ? itemText(dn[0]) : 'Could not study much', focus: dn.length===di.length ? 4 : 3,
            reason: dn.length===di.length ? '' : (rnd() < .5 ? 'Too much school homework' : 'Family function in the evening'),
            doubt: rnd() < .15 ? 'Gaining ratio when two partners retire together?' : '', photos: []});
        });
      }
      return st;
    })};
  }
  return {
    register({answers, pin}){ load(); if (db.students.some(s => s.phone===answers.phone)) throw new Error('This WhatsApp number is already registered. Log in with your PIN instead.');
      const s = {phone:answers.phone, name:answers.name, pin, token:uid(), joined:ymd(today0()), answers, items:[], checkins:[]}; db.students.push(s); persist(); return {token:s.token, state:pub(s)}; },
    login({phone, pin}){ load(); const s = db.students.find(x => x.phone===phone); if (!s || s.pin!==pin) throw new Error('WhatsApp number or PIN is wrong.'); return {token:s.token, state:pub(s)}; },
    resume({token}){ return {state:pub(byTok(token))}; },
    savePlan({token, start, end, items}){ const s = byTok(token); s.items = s.items.filter(i => i.date<start || i.date>end).concat(items); persist(); return {state:pub(s)}; },
    setDone({token, id, done}){ const s = byTok(token); const it = s.items.find(i => i.id===id); if (it) it.done = !!done; persist(); return {state:pub(s)}; },
    checkin({token, date, data, doneIds, photos}){ const s = byTok(token);
      s.items.forEach(i => { if (i.date===date) i.done = doneIds.includes(i.id); });
      s.checkins = s.checkins.filter(c => c.date!==date).concat([Object.assign({date}, data, {photos:(photos||[]).map(p => '(preview) '+p.name)})]); persist(); return {state:pub(s)}; },
    mentorAll(){ load(); return {students: db.students.map(pub)}; },
    reset(){ db = seed(); persist(); },
  };
})();

function chipGroup(name, opts, type, checkedFn, attrs){

  const err = errors[f.id] ? `<p class="err">${esc(errors[f.id])}</p>` : '';

  let body = '';
  switch (f.type){
    case 'text': case 'tel': case 'email': case 'date': case 'time':
      return `<div class="field"><label for="${id}">${lab}</label>${help}<input id="${id}" type="${f.type}" ${da} value="${esc(v||'')}" ${f.type==='tel'?'inputmode="numeric" maxlength="10"':''}>${err}</div>`;

    case 'choice': body = chipGroup(id, f.opts, 'radio', o => v===o, da); break;

    case 'scale': body = `<div class="scale"><span class="muted">${esc(f.lo)}</span>${chipGroup(id,['1','2','3','4','5'],'radio',o=>String(v)===o,da)}<span class="muted">${esc(f.hi)}</span></div>`; break;

          <span class="muted">out of</span>
          <input type="text" inputmode="numeric" aria-label="${esc(r)}: total marks" placeholder="Total" ${da} data-r="${esc(r)}" data-part="o" value="${esc(mk.o||'')}">
          <span class="pct mono">${p!=null && p<=100 ? '= '+p+'%' : ''}</span></span></div>`; }).join('')}</div>`;
      break;
    case 'chapters': {
      const chs = chaptersOf(f.subject, FA.accOption), units = [];
      chs.forEach(c => { let u = units.find(x => x.unit===c.unit); if (!u) units.push(u = {unit:c.unit, marks:c.unitMarks, list:[]}); u.list.push(c); });
      body = units.map(u => `<div class="unit"><div class="unit-h"><span>${esc(u.unit)}</span><span class="unit-m">${u.marks} marks for this unit</span></div>

    default: {

function onFormInput(e){
  const el = e.target, id = el.dataset.f; if (!id) return;
  const f = SECTIONS.flatMap(s=>s.f).find(x=>x.id===id), r = el.dataset.r;
  if (f.type==='multi'){ const set = new Set(FA[id]||[]); el.checked ? set.add(el.value) : set.delete(el.value); FA[id] = [...set]; }
  else if (f.type==='mgrid'){ FA[id] = FA[id]||{}; const set = new Set(FA[id][r]||[]); el.checked ? set.add(el.value) : set.delete(el.value); FA[id][r] = [...set]; }
  else if (f.type==='marks'){ FA[id] = FA[id]||{}; FA[id][r] = FA[id][r]||{}; FA[id][r][el.dataset.part] = el.value.replace(/[^\d.]/g,'');
    const p = pctOf(FA[id][r]); el.closest('.mrow').querySelector('.pct').textContent = p!=null && p<=100 ? '= '+p+'%' : ''; }
  else if (r){ FA[id] = FA[id]||{}; FA[id][r] = el.value; }
  else FA[id] = f.type==='pin' ? el.value.replace(/\D/g,'') : el.value;
  saveDraft();
}
function filled(f){
  const v = FA[f.id];
  if (f.type==='marks') return f.rows.every(r => v && v[r] && v[r].s!=='' && v[r].s!=null && v[r].o);
  if (f.type==='grid'||f.type==='chapters'){ const rows = f.type==='chapters' ? chaptersOf(f.subject, FA.accOption).map(c=>c.chapter) : f.rows; return rows.every(r => v && v[r]); }
  if (f.type==='mgrid') return f.rows.every(r => v && v[r] && v[r].length);
  if (f.type==='multi') return (v||[]).length >= (f.min||1);
  return v!==undefined && String(v).trim()!=='';
}
function validate(sec){
  const e = {};
  sec.f.forEach(f => {
    const v = FA[f.id];
    if (f.req && !filled(f)) e[f.id] = f.type==='marks' ? 'Fill marks and total for every subject.' : ['grid','chapters','mgrid'].includes(f.type) ? 'Please answer every row.' : f.min ? 'Please tick all '+f.min+'.' : 'Please answer this.';
    else if (f.type==='marks' && v){ const bad = f.rows.find(r => { const x = v[r]; if (!x || (!x.s && !x.o)) return false; return !x.s || !x.o || +x.s > +x.o; }); if (bad) e[f.id] = bad+': marks cannot be blank or more than the total.'; }
    else if (f.type==='tel' && v && !/^[6-9]\d{9}$/.test(v)) e[f.id] = 'Enter a 10-digit mobile number, without +91 or 0.';
    else if (f.type==='email' && v && !/^\S+@\S+\.\S+$/.test(v)) e[f.id] = 'Enter a valid email address.';
    else if (f.type==='pin' && v && !/^\d{4}$/.test(v)) e[f.id] = 'The PIN must be exactly 4 digits.';
  });
  if (sec.f.some(f=>f.id==='preEnd') && FA.preStart && FA.preEnd && FA.preEnd < FA.preStart) e.preEnd = 'End date is before the start date.';
  return e;
}

function adderHTML(k){

function wireAdder(wk){
  const A = V.editingAdder;
  const read = () => { A.subject = document.getElementById('a_s').value; A.chapter = document.getElementById('a_c').value; A.activity = document.getElementById('a_a').value; A.qty = document.getElementById('a_q').value.replace(/\D/g,''); };

  document.getElementById('a_q').addEventListener('input', () => { read(); const m = itemMinutes({subject:A.subject, chapter:A.chapter, activity:A.activity, qty:A.qty}); document.getElementById('a_calc').textContent = m ? '= about '+fmtMin(m) : ''; });
  on('a_cancel', () => { V.adding = null; renderPlan(); });
  on('a_add', () => {

    PLAN_ITEMS.push({id:uid(), date:V.adding, subject:A.subject, chapter:A.chapter, activity:A.activity, qty:+A.qty, sugg:false, done:false});

function savePlanSoon(wk){

function readPhotos(files){

}

    return {m, lab, streak, ws, last};
  });
  const order = {red:0, yellow:1, new:2, green:3};
  rows.sort((a,b) => order[a.lab.k]-order[b.lab.k] || b.streak-a.streak);
  const f = V.filter, shown = rows.filter(r => f==='all' || (f==='missed' ? r.streak>0 : r.lab.k===f));
  const count = k => rows.filter(r => k==='missed' ? r.streak>0 : r.lab.k===k).length;
  scr.innerHTML = `<div class="stack">
    <div class="hero" style="padding-bottom:0"><div class="eyebrow">Mentor view · ${fmtY(today0())}</div><h1>All students (${rows.length})</h1></div>
    <div class="filters" role="group" aria-label="Filter">${[['all','All'],['red','Far behind ('+count('red')+')'],['yellow','A little behind ('+count('yellow')+')'],['green','On track ('+count('green')+')'],['missed','Missed yesterday ('+count('missed')+')']]
      .map(([k,l]) => `<button type="button" data-fl="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
    <div class="stack" style="gap:10px">${shown.map(r => `<button class="srow" type="button" data-st="${esc(r.m.phone)}">
        <span class="nm">${esc(r.m.name)}</span>${labelChip(r.lab)}
        <span class="meta"><span>This week ${fmtH(r.ws.done)} / ${fmtH(r.ws.planned)}</span>
          <span class="${r.streak>=3?'bad':''}">${r.streak ? r.streak+' day'+(r.streak>1?'s':'')+' without check-in'+(r.streak>=3?' · call today':'') : 'Checked in yesterday'}</span>
          <span>${r.lab.f && r.lab.f.date ? (r.lab.f.after ? 'Syllabus not done before boards' : 'Syllabus by '+fmt(r.lab.f.date)) : r.lab.f && r.lab.f.done ? 'Syllabus done' : ''}</span>
          <span>${esc(r.m.phone)}</span></span></button>`).join('') || '<p class="muted">No students in this group.</p>'}</div>
    ${IS_LIVE ? '' : '<div class="actions"><button class="btn" type="button" id="toGate2">Back to start page</button></div>'}
  </div>`;
  scr.querySelectorAll('[data-fl]').forEach(b => b.addEventListener('click', () => { V.filter = b.dataset.fl; renderMentor(); }));
  scr.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => go('mentorStudent', {mPhone: b.dataset.st, wk: today0()})));
  on('toGate2', () => go('gate'));
}
function parentReport(m){
  const wk = m.t.getDay()===0 ? weekOf(addDays(m.t,-1), m.joined) : weekOf(m.t, m.joined), ws = weekStats(m, wk);
  const doneCh = [...new Set(ws.its.filter(i => i.done && i.chapter).map(i => i.chapter))];
  const pend = [...new Set(ws.its.filter(i => !i.done && i.chapter && i.d < m.t).map(i => i.chapter))].filter(c => !doneCh.includes(c));
  const pct = ws.planned ? Math.round(ws.done/ws.planned*100) : 0, lab = statusLabel(m);
  const well = [], bad = [];
  if (ws.ci >= Math.min(6, ws.past.length)) well.push(`Check-in filled ${ws.ci} of ${ws.past.length} days`); else bad.push(`Check-in filled only ${ws.ci} of ${ws.past.length} days`);
  if (ws.planned){ if (pct >= 80) well.push(`${fmtH(ws.done)} studied, ${pct}% of the plan`); else bad.push(`${fmtH(ws.done)} of ${fmtH(ws.planned)} planned (${pct}%)`); }
  if (doneCh.length) well.push('Worked on: '+doneCh.slice(0,4).join(', '));
  if (pend.length) bad.push('Pending: '+pend.slice(0,4).join(', '));
  const reasons = [...new Set(m.checkins.filter(c => c.date>=ymd(wk.start) && c.date<=ymd(wk.end) && c.reason).map(c => c.reason))];
  if (reasons.length) bad.push('Reasons given: '+reasons.slice(0,2).join('; '));
  return `Weekly report: ${m.name} (${fmt(wk.start)} to ${fmt(wk.end)})
Status: ${lab.text}

What went well:
- ${well.join('\n- ') || '[add one honest positive]'}

What did not go well:
- ${bad.join('\n- ') || 'Nothing major this week'}

Next week's fix:
- ${pend.length ? 'Finish '+pend[0]+' first, before new chapters. ' : ''}[add one specific fix]

- Mahendra Sir`;
}
function renderMentorStudent(){
  const m = MENTOR.find(x => x.phone===V.mPhone); if (!m) return go('mentor');
  const a = m.a, lab = statusLabel(m), wk = weekOf(V.wk || m.t, m.joined), cur = weekOf(m.t, m.joined), report = parentReport(m);
  const pctTxt = id => SUBJECTS.map(s => { const p = pctOf((a[id]||{})[s]); return `${s.split(' ')[0]} ${p==null?'–':p+'%'}`; }).join(' · ');
  const brief = [
    ['Class 11 marks', pctTxt('class11')], ['Latest test', pctTxt('latest')],
    ['Board target', SUBJECTS.map(s => s.split(' ')[0]+' '+((a.target||{})[s]||'–')).join(' · ')],
    ['Free hours', `${a.weekdayHrs} h school days · ${a.satHrs} h Sat · ${a.sunHrs} h Sun`],
    ['Teacher / batch', a.teacher], ['Problems', (a.problems||[]).join(', ')], ['Phone use', a.phoneUse], ['Stress (1-5)', a.stress],
    ['Sleep', a.sleepHrs], ['Worried about', [a['fear_Accountancy'], a['fear_Business Studies'], a['fear_Economics']].filter(Boolean).join(' | ')],
    ['Wants from Sir', a.wantMentor], ['Parent', `${a.parentName||'–'} · ${a.parentPhone||'–'} · report in ${a.reportLang||'English'}`], ['Parent says', a.parentWorry],
    ['After Class 12', (a.career||[]).join(', ')],
  ].filter(x => x[1]);
  const doubts = m.checkins.filter(c => c.doubt).sort((x,y) => y.date.localeCompare(x.date)).slice(0,6);
  scr.innerHTML = `<div class="narrow stack">
    <div class="hero" style="padding-bottom:0"><div class="eyebrow">Mentor view · joined ${fmt(m.joined)}</div><h1>${esc(m.name)}</h1>
      <p class="mono muted">${esc(m.phone)}</p>
      <p style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${labelChip(lab)}<span class="muted" style="font-size:.95rem">${esc(lab.why)}</span></p></div>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><h3>Sunday report for the parent</h3><button class="btn small" type="button" id="copyRep">Copy</button></div>
      <div class="report" id="rep" tabindex="0">${esc(report)}</div><p class="muted" style="font-size:.9rem;margin-top:8px">Edit the [brackets], then send it on WhatsApp to ${esc(a.parentPhone||'the parent')}.</p></div>
    <div class="card"><h3 style="margin-bottom:6px">Doubts asked</h3>${doubts.length ? doubts.map(c => `<div class="log"><b>${fmt(D(c.date))}</b> · ${esc(c.doubt)}</div>`).join('') : '<p class="muted">No doubts yet.</p>'}</div>
    <div style="display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap"><h2>Week ${fmt(wk.start)} – ${fmt(wk.end)}</h2>
      <span class="actions"><button class="btn small" type="button" id="mPrev" ${wk.start > m.joined ? '' : 'disabled'}>‹ Earlier</button><button class="btn small" type="button" id="mNext" ${wk.key===cur.key?'disabled':''}>Later ›</button></span></div>
    ${reviewHTML(m, wk)}
    ${m.checkins.some(c => c.photos && c.photos.length) ? `<div class="card"><h3 style="margin-bottom:6px">Photos</h3>${m.checkins.filter(c => c.photos && c.photos.length).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,10).map(c => `<div class="log"><b>${fmt(D(c.date))}</b> · ${c.photos.map((p,i) => /^https?:/.test(p) ? `<a href="${esc(p)}" target="_blank" rel="noopener">Photo ${i+1}</a>` : esc(p)).join(' · ')}</div>`).join('')}</div>` : ''}
    <details class="card"><summary style="cursor:pointer"><b>Joining form answers</b></summary><dl class="kv" style="margin-top:10px">${brief.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details>
    <div class="actions"><button class="btn" type="button" id="back">Back to all students</button></div>
  </div>`;
  on('back', () => go('mentor'));
  on('mPrev', () => { V.wk = addDays(wk.start,-1); renderMentorStudent(); });
  on('mNext', () => { V.wk = addDays(wk.end,1); renderMentorStudent(); });
  on('copyRep', () => {
    const el = document.getElementById('rep');
    const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl+C to copy.'); };
    try { navigator.clipboard.writeText(report).then(() => toast('Report copied'), sel); } catch(e){ sel(); }
  });
}

function boot(params){
  if (params.view==='mentor') return openMentor(params.key || '');
  const tok = store.get('c12.token');
  if (!tok){ go('gate'); return; }
  scr.innerHTML = '<div class="narrow card"><p class="muted">Opening your plan…</p></div>';
  API('resume', {token: tok}).then(r => { TOKEN = tok; setState(r.state); go('home', {day: today0()}); })
    .catch(() => { store.set('c12.token', null); go('gate'); });
}
if (IN_GAS && google.script.url) google.script.url.getLocation(loc => boot(loc.parameter || {}));
else if (REMOTE) boot(Object.fromEntries(new URLSearchParams(location.search)));
else boot({});
</script>
