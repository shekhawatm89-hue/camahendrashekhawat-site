<style>
/* Pilot build: phone-first, big tap targets, system fonts only (fast). Ink blue, red margin accent. */
:root{
  --paper:#f3f6fc; --sheet:#ffffff; --ink:#18264a; --muted:#5f6b86; --rule:#e1e7f2; --rule-strong:#c4cee2;
  --accent:#2445a8; --accent-ink:#ffffff; --accent-soft:#e7ecfa; --margin:#d4405a;
  --acc:#2445a8; --acc-soft:#e6ebfa; --bs:#0f7a6c; --bs-soft:#dff3ef; --eco:#9a5506; --eco-soft:#fbeedc; --all:#5b4fb0; --all-soft:#ece9fb; --qa:#a3317a; --qa-soft:#f9e4f1;
  --good:#1d7a45; --good-soft:#e2f4e8; --warn:#8a5a00; --bad:#b4233c; --bad-soft:#fbe6ea;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0b1120; --sheet:#141c30; --ink:#e4e9f5; --muted:#9aa6c2; --rule:#25304a; --rule-strong:#3a4766;
  --accent:#93a9ff; --accent-ink:#0b1120; --accent-soft:#1e2a4d; --margin:#ff7d93;
  --acc:#93a9ff; --acc-soft:#1e2a4d; --bs:#5fd0bd; --bs-soft:#123630; --eco:#f0b25c; --eco-soft:#3a2a12; --all:#b9b0ff; --all-soft:#272245; --qa:#f28cc8; --qa-soft:#3a1730;
  --good:#6fd697; --good-soft:#143323; --warn:#f2c065; --bad:#ff8fa2; --bad-soft:#3d1820; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b1120; --sheet:#141c30; --ink:#e4e9f5; --muted:#9aa6c2; --rule:#25304a; --rule-strong:#3a4766;
  --accent:#93a9ff; --accent-ink:#0b1120; --accent-soft:#1e2a4d; --margin:#ff7d93;
  --acc:#93a9ff; --acc-soft:#1e2a4d; --bs:#5fd0bd; --bs-soft:#123630; --eco:#f0b25c; --eco-soft:#3a2a12; --all:#b9b0ff; --all-soft:#272245; --qa:#f28cc8; --qa-soft:#3a1730;
  --good:#6fd697; --good-soft:#143323; --warn:#f2c065; --bad:#ff8fa2; --bad-soft:#3d1820; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;margin:0}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.65rem} h2{font-size:1.25rem;margin-bottom:6px} h3{font-size:1.05rem;margin-bottom:6px}
p{margin:6px 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .tiny{font-size:.85rem} .mono{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;max-width:640px;margin:0 auto}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;font-size:.95rem}
.brand-av{width:30px;height:30px;border-radius:50%;object-fit:cover}
#barR{font-size:.88rem}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:4px 64px}
.narrow{max-width:640px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:18px 16px 18px 26px;position:relative}
.card::before{content:"";position:absolute;left:12px;top:16px;bottom:16px;width:2px;background:var(--margin);opacity:.45}
.btn{border:1.5px solid var(--rule-strong);background:var(--sheet);border-radius:12px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:15px 18px;font-size:1.05rem;min-height:52px}
.btn.wide{width:100%}
.btn.small{padding:7px 12px;font-size:.92rem}
.btn:disabled{opacity:.5}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.steps3{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps3 li{display:flex;align-items:center;gap:10px;font-size:1.02rem}
.steps3 b{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.banner{border-radius:12px;padding:12px 14px;background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:0}
.field{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px dashed var(--rule)}
.field:first-of-type{border-top:0}
.field>label,.lbl{font-weight:700}
.fhelp{font-size:.9rem;color:var(--muted);margin:-4px 0 0}
.req{color:var(--margin)}
.err{color:var(--bad);font-weight:600;font-size:.93rem}

// Share of a chapter's normal hours still needed. Older answers (5-level form) are mapped too.
const STATUS_FACTOR = {'Not started':1, 'Completed once':.45, 'Revision done':.2, 'Final touch done':.05, 'Done in class':.6, 'Practice done':.3,
  'Taught / lecture done only':.75, 'Lecture done':.75, 'Notes made':.55, 'Practised':.35, 'Practised questions':.35, 'Confident':.15, 'Confident (can do PYQs)':.15};
const SECTIONS = [
 {t:'About you', h:'Takes under 5 minutes.', f:[

  {id:'school',l:'School name',type:'text',req:1}]},
 {t:'Marks and study time', h:'', f:[
  {id:'latest',l:'Marks in your last test',type:'marks',rows:SUBJECTS,req:1,help:'Marks you got, out of the total of that paper.'},
  ...PROGRAM.extraFields,
  {id:'weekdayHrs',l:'Self-study hours on a school day',type:'select',opts:hrs(1,8),req:1,help:'Not counting school, coaching or travel.'},
  {id:'sunHrs',l:'Self-study hours on Sunday',type:'select',opts:hrs(0,10),req:1},
  {id:'ttMode',l:'Who should make your daily timetable?',type:'choice',opts:['Mahendra Sir makes it','I will make my own'],req:1,help:'You can change this any time in My week.'}]},
 {t:'Chapters', h:'Tap one for each chapter. Done once = completed once · Revised = revision done · Final = final touch done.', f:[
  ...SUBJECTS.map(s => ({id:'ch_'+s, l:s, type:'chapters', subject:s, req:1})),
  {id:'pin',l:'Make a 4-digit PIN',type:'pin',req:1,help:'You will log in with your WhatsApp number and this PIN.'},

   opts:['I agree that Mahendra Sir stores my answers and sends a weekly progress line to my parent']}]},
];
const chaptersOf = (s, acc) => SYL.filter(c => c.subject===s && (c.applies==='All' || c.applies===(acc==='Computerised Accounting'?'CA':'AFS')));

function sampleAnswers(){
  const a = {name:'Aarav Mehta (sample)', phone:'9876500000', parentPhone:'9876500001', school:'Delhi Public School',
    latest:Object.fromEntries(SUBJECTS.map((s,i) => [s, {s:String([28,31,52,60][i]), o:String([50,40,80,100][i])}])),
    weekdayHrs:'3', sunHrs:'4', ttMode:'Mahendra Sir makes it', consent:[SECTIONS[2].f.find(f => f.id==='consent').opts[0]]};
  Object.assign(a, PROGRAM.sample);
  SUBJECTS.forEach(s => { a['ch_'+s] = {}; chaptersOf(s,'').forEach((c,i) => a['ch_'+s][c.chapter] = CH_STATUS[i < 1 ? 2 : i < 5 ? 1 : 0]); });
  return a;
}

// =====================================================================
// Pilot rules
//   Mon–Sat: Accountancy every day (half the day's hours); the other half goes to
//            Economics or Business Studies in turn, Eco : BS = 6 : 4 over time.
//   Sunday:  catch-up slot (any subject) with the student's Sunday hours.
//   We fix the time slots; the student picks the chapter and what to do in each.
// =====================================================================
const SPLIT = {accountsShare:.5, eco:.6, bs:.4};
const ACT = {lecture:'Lecture', notes:'Notes', practice:'Questions', revise:'Revision'};
const PER_Q = (subject, kind) => /^Account/.test(subject) ? 10 : subject==='Quantitative Aptitude' ? 3 : subject==='Business Economics' ? 2 : (subject==='Economics' && kind==='num' ? 6 : 8);
const CHAP = {}; SYL.forEach(c => CHAP[c.chapter] = c);
// A slot can hold several chapters, kept as "Chapter A + Chapter B"; its time is shared equally between them.
const CH_SEP = ' + ';
const chs = it => String(it.chapter || '').split(CH_SEP).filter(Boolean);
const itemMinutes = it => it.activity==='questions' ? (+it.qty||0)*PER_Q(it.subject,(CHAP[chs(it)[0]]||{}).kind) : it.activity==='answers' ? (+it.qty||0)*8 : (+it.qty||0);
const doneFrac = it => it.done===true ? 1 : it.done==='partly' ? .5 : 0;
const fmtH = m => { const h = Math.round(m/30)/2; return (h%1 ? h : h.toFixed(0)) + ' h'; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const sundayOf = d => addDays(d, -d.getDay());
const daysBetween = (a,b) => Math.round((b - a) / 864e5);
const eachDay = (a,b) => { const out = []; for (let d = new Date(a); d <= b; d = addDays(d,1)) out.push(new Date(d)); return out; };
const weekOf = (d, joined) => { const s = sundayOf(d); return {start: s < joined ? new Date(joined) : s, end: addDays(s,6), key: ymd(s)}; };
const SHORT = {'Accountancy':'Accounts','Business Studies':'BS','Economics':'Eco','Accounting':'Accounts','Business Laws':'Law','Quantitative Aptitude':'QA','Business Economics':'Eco'};
const short = s => SHORT[s] || 'Catch-up';
const SUBCLS = {'Accountancy':'Accountancy','Business Studies':'Business','Economics':'Economics','Accounting':'Accountancy','Business Laws':'Law','Quantitative Aptitude':'QA','Business Economics':'Economics'};
const subCls = s => 'sub-' + (SUBCLS[s] || 'All');

function buildModel(state){
  const a = state.profile.answers || {}, t = today0(), j0 = D(state.profile.joined) || t, joined = j0 > t ? t : j0;
  const marks = {}; SUBJECTS.forEach(s => marks[s] = pctOf((a.latest||{})[s]) ?? 65);
  const items = (state.items||[]).map(it => Object.assign({}, it, {d:D(it.date), min:itemMinutes(it)}));
  const doneMin = {}; items.forEach(it => { const cs = chs(it); cs.forEach(ch => doneMin[ch] = (doneMin[ch]||0) + it.min*doneFrac(it)/cs.length); });
  const chapters = SUBJECTS.flatMap(s => chaptersOf(s, a.accOption).map(c => {
    const label = ((a['ch_'+s])||{})[c.chapter] || 'Not started', f = STATUS_FACTOR[label] ?? 1;
    const total = Math.round(c.base*60*f*(marks[s] < 60 ? 1.15 : 1)), done = doneMin[c.chapter]||0;
    return Object.assign({}, c, {label, factor:f, total, done, rem:Math.max(0,total-done)});
  }));
  const remBy = {}, totalBy = {};
  SUBJECTS.forEach(s => { const cs = chapters.filter(c => c.subject===s); remBy[s] = cs.reduce((x,c)=>x+c.rem,0); totalBy[s] = cs.reduce((x,c)=>x+c.total,0); });
  const wd = +a.weekdayHrs || 3, sun = a.sunHrs===undefined ? 4 : +a.sunHrs;
  return {state, a, t, joined, marks, items, chapters, remBy, totalBy, wd, sun, name: state.profile.name || a.name || 'Student',
    phone: state.profile.phone, parentPhone: state.profile.parentPhone || a.parentPhone, checkins: state.checkins||[]};
}
// Finish date: from real pace once a week of data exists, otherwise from the student's own study hours.
function finishInfo(m){
  const rem = SUBJECTS.reduce((x,s)=>x+m.remBy[s],0), total = SUBJECTS.reduce((x,s)=>x+m.totalBy[s],0);
  const pct = total ? Math.round((1-rem/total)*100) : 100;
  const days = daysBetween(m.joined, m.t);
  const from = addDays(m.t,-14 < -days ? -days : -14), span = Math.max(1, daysBetween(from, m.t));
  const real = m.items.filter(i => i.d>=from && i.d<m.t).reduce((x,i)=>x+i.min*doneFrac(i),0) / span;
  const planned = (m.wd*6 + m.sun)*60/7;
  const E = PROGRAM.examFor(m.a), useReal = days >= 7, perDay = useReal ? real : planned, board = D(E.boardStart);
  if (rem <= 0) return {pct, done:true, basis:'done'};
  if (!perDay) return {pct, none:true, basis: useReal ? 'pace' : 'hours'};
  const n = Math.ceil(rem/perDay), date = addDays(m.t, n);
  return {pct, date, after: date >= board, late: date > D(E.coverageEnd), basis: useReal ? 'pace' : 'hours'};
}
const finishText = f => f.done ? 'Syllabus first round done' : f.none ? 'Syllabus finish date: start ticking targets to see it' :
  'Syllabus finishes on: ' + (f.after ? 'after the board exams' : fmtY(f.date));

// Which of Eco / BS gets the second slot on day d: weighted turn-taking counted from the joining day.
function secondSubject(m, d){
  let e = 0, b = 0;
  for (let x = new Date(m.joined); x < d; x = addDays(x,1)) { if (x.getDay()===0) continue; if (e/SPLIT.eco <= b/SPLIT.bs) e++; else b++; }
  return e/SPLIT.eco <= b/SPLIT.bs ? 'Economics' : 'Business Studies';
}
// Ratio rule (CA Foundation): a weekday has 1-4 slots by hours; each slot goes to the subject furthest behind its
// share of time since joining, one slot per subject per day. Finished subjects drop out and their time moves to the rest.
function ratioDay(w, H, subs){
  const n = Math.min(subs.length, H < 120 ? 1 : H <= 270 ? 2 : H <= 450 ? 3 : 4);
  const base = Math.floor(H/30/n), extra = H/30 - base*n;
  return Array.from({length:n}, (_, i) => (base + (i < extra ? 1 : 0)) * 30);
}
function ratioSlots(m, d, left){
  const w = PROGRAM.ratio(m.a), subs = SUBJECTS.filter(s => w[s]), tot = subs.reduce((x,s)=>x+w[s],0), H = Math.round(m.wd*2)*30;
  const given = {}; subs.forEach(s => given[s] = 0); let all = 0;
  const pick = (cands, k) => cands.slice().sort((a,b) => (w[b]/tot*all - given[b]) - (w[a]/tot*all - given[a]) || subs.indexOf(a)-subs.indexOf(b)).slice(0, k);
  for (let x = new Date(m.joined); x < d; x = addDays(x,1)){
    if (x.getDay()===0) continue;
    const mins = ratioDay(w, H, subs); pick(subs, mins.length).forEach((s,i) => { given[s] += mins[i]; }); all += H;
  }
  const open = subs.filter(s => left(s));
  if (!open.length) return [{subject:'All', mins:H}];
  const mins = ratioDay(w, H, open);
  return pick(open, mins.length).map((s,i) => ({subject:s, mins:mins[i]}));
}
function slotsFor(m, d, remLeft){
  const left = s => SUBJECTS.includes(s) ? chaptersOf(s, m.a.accOption).reduce((x,c)=>x+Math.max(0,remLeft[c.chapter]),0) : 1;
  if (d.getDay()===0) return m.sun > 0 ? [{subject:'All', mins:Math.round(m.sun*2)*30}] : [];
  if (PROGRAM.ratio) return ratioSlots(m, d, left);
  const H = Math.round(m.wd*2)*30;
  let first = 'Accountancy', second = secondSubject(m, d);
  if (!left(second)) second = second==='Economics' ? 'Business Studies' : 'Economics';
  if (!left(first)) first = second===SUBJECTS[2] ? SUBJECTS[1] : SUBJECTS[2];
  if (!left(second) || first===second) return [{subject:first, mins:H}];
  const a = H >= 60 ? Math.min(H-30, Math.max(30, Math.round(H*SPLIT.accountsShare/30)*30)) : H;
  return a===H ? [{subject:first, mins:H}] : [{subject:first, mins:a}, {subject:second, mins:H-a}];
}
function pickContent(m, subject, mins, remLeft){
  const pool = subject==='All' ? m.chapters : m.chapters.filter(c => c.subject===subject);
  const c = pool.find(x => remLeft[x.chapter] > 0) || pool[0];
  if (!c) return {chapter:'', activity:'revise'};
  const untouched = remLeft[c.chapter] >= c.total;
  const activity = subject==='All' ? 'practice' : (c.factor >= .75 && untouched) ? 'lecture' : c.factor >= .4 ? 'practice' : 'revise';
  remLeft[c.chapter] -= mins;
  return {chapter:c.chapter, activity};
}
// Fills every empty day from `from` to the end of the week with ready slots.
function suggestDays(m, days, existing){
  const remLeft = {}; m.chapters.forEach(c => remLeft[c.chapter] = c.rem);
  existing.filter(i => !i.done && i.chapter).forEach(i => { const cs = chs(i); cs.forEach(ch => remLeft[ch] = (remLeft[ch]||0) - itemMinutes(i)/cs.length); });
  const out = [];
  days.forEach(d => slotsFor(m, d, remLeft).forEach(s => {
    const c = pickContent(m, s.subject, s.mins, remLeft);
    out.push({id:uid(), date:ymd(d), subject:s.subject, chapter:c.chapter, activity:c.activity, qty:s.mins, sugg:true, done:false});
  }));
  return out;
}
function missedStreak(m){ let n = 0; for (let d = addDays(m.t,-1); d >= m.joined; d = addDays(d,-1)){ if (m.checkins.some(c => c.date===ymd(d))) break; n++; } return n; }
function weekNumbers(m, wk){
  const its = m.items.filter(i => i.d>=wk.start && i.d<=wk.end && i.d<=m.t);
  const plan = its.reduce((x,i)=>x+i.min,0), done = its.reduce((x,i)=>x+i.min*doneFrac(i),0);
  const days = eachDay(wk.start, wk.end).filter(d => d<=m.t);
  return {targetsPct: plan ? Math.round(done/plan*100) : 0, ci: days.filter(d => m.checkins.some(c => c.date===ymd(d))).length, days: days.length};
}

const CLS = '12';
const API_URL = 'https://script.google.com/macros/s/AKfycbwmz8Zgg_uPL3sYrkm49ZRWFEZ7Ab3UR9TfKfzZJmyamJQW9rsg2rWxp2f0rAFZ8xNY/exec';
const IN_GAS = !!(window.google && google.script && google.script.run);
const REMOTE = !IN_GAS && /(^|\.)camahendrashekhawat\.com$/.test(location.hostname);
const IS_LIVE = IN_GAS || REMOTE;
function API(name, args){
  if (REMOTE) return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({name, args:Object.assign({}, args||{}, {cls:CLS})}), redirect:'follow', credentials:'omit'})
    .catch(() => { throw new Error('No internet. Check your network and try again.'); })
    .then(r => r.json()).then(j => { if (j.error) throw new Error(j.error); return j.result; });
  return new Promise((res, rej) => {
    if (IN_GAS) google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error(e && e.message || String(e)))).api(name, Object.assign({}, args||{}, {cls:CLS}));
    else setTimeout(() => { try { res(Mock[name](args || {})); } catch(e){ rej(e); } }, 120);
  });
}
const Mock = (() => {
  const K = 'c12pilot.preview.v2'; let db = null;
  const load = () => { if (db) return; try { db = JSON.parse(localStorage.getItem(K)); } catch(e){} if (!db || !db.students) { db = seed(); persist(); } };
  const persist = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch(e){} };
  const pub = s => ({profile:{phone:s.phone, name:s.name, joined:s.joined, parentPhone:s.answers.parentPhone, answers:s.answers}, items:s.items, checkins:s.checkins});
  const byTok = tok => { load(); const s = db.students.find(x => x.token===tok); if (!s) throw new Error('Please log in again.'); return s; };
  function seed(){
    let r = 11; const rnd = () => (r = (r*16807) % 2147483647) / 2147483647;
    const t = today0();
    const people = [['Aarav Mehta','9876500000',9,.85,.9,0],['Riya Sharma','9876500002',13,.95,1,0],['Kabir Singh','9876500003',13,.6,.8,1],['Ishaan Gupta','9876500004',12,.35,.5,3],['Diya Jain','9876500005',6,.8,.85,0]];
    return {students: people.map(([name, phone, ago, doneP, ciP, miss], k) => {
      const ans = Object.assign(sampleAnswers(), {name, phone, parentPhone:'98765100'+k+k, weekdayHrs: String([3,4,2.5,2,3][k]), sunHrs: String([4,5,3,2,4][k])});
      const st = {phone, name, pin:'1234', token:'demo-'+phone, joined:ymd(addDays(t,-ago)), answers:ans, items:[], checkins:[]};
      for (let wk = weekOf(D(st.joined), D(st.joined)); wk.start <= t; wk = weekOf(addDays(wk.end,1), D(st.joined))){
        const items = suggestDays(buildModel(pub(st)), eachDay(wk.start, wk.end), []);
        items.forEach(it => { const d = D(it.date); if (d < t && daysBetween(d,t) > miss){ const x = rnd(); it.done = x < doneP ? true : x < doneP + .1 ? 'partly' : false; } });
        st.items = st.items.concat(items);
        eachDay(wk.start, wk.end).filter(d => d < t && daysBetween(d,t) > miss && rnd() < ciP).forEach(d => {
          const di = items.filter(i => i.date===ymd(d));
          st.checkins.push({date:ymd(d), hours: Math.round(di.reduce((x,i)=>x+i.min*doneFrac(i),0)/30)/2, finished: di.every(i=>i.done===true) ? 'Done' : 'Partly', what: (di[0]||{}).chapter||'', reason: rnd()<.15 ? 'Stuck' : '', doubt:'', photos:[]});
        });
      }
      return st;
    })};
  }
  return {
    register({answers, pin}){ load(); if (db.students.some(s => s.phone===answers.phone)) throw new Error('This number has already joined. Log in with your PIN.');
      const s = {phone:answers.phone, name:answers.name, pin, token:uid(), joined:ymd(today0()), answers, items:[], checkins:[]}; db.students.push(s); persist(); return {token:s.token, state:pub(s)}; },
    login({phone, pin}){ load(); const s = db.students.find(x => x.phone===phone); if (s && !s.pin && /^\d{4}$/.test(pin)) s.pin = pin; if (!s || s.pin!==pin) throw new Error('WhatsApp number or PIN is wrong.'); return {token:s.token, state:pub(s)}; },
    resume({token}){ return {state:pub(byTok(token))}; },
    savePlan({token, start, end, items}){ const s = byTok(token); s.items = s.items.filter(i => i.date<start || i.date>end).concat(items); persist(); return {state:pub(s)}; },
    checkin({token, date, status, data, photos}){ const s = byTok(token);
      s.items.forEach(i => { if (i.date===date && status[i.id]) i.done = status[i.id]==='done' ? true : status[i.id]==='partly' ? 'partly' : false; });
      s.checkins = s.checkins.filter(c => c.date!==date).concat([Object.assign({date}, data, {photos:(photos||[]).map(p => '(preview) '+p.name)})]); persist(); return {state:pub(s)}; },
    feedback({token, phone, screen, message}){ load(); let who = phone || ''; try { if (token) who = byTok(token).phone; } catch(e){} db.feedback = db.feedback || []; db.feedback.unshift({when: ymd(new Date()) + ' ' + new Date().toTimeString().slice(0,5), phone: who, screen: screen || '', message}); persist(); return {ok:true}; },
    updateHours({token, weekdayHrs, sunHrs}){ const s = byTok(token); s.answers.weekdayHrs = String(weekdayHrs); s.answers.sunHrs = String(sunHrs); persist(); return {state:pub(s)}; },
    mentorAll(){ load(); return {students: db.students.map(s => { const p = pub(s); p.profile.status = s.status || 'Active'; return p; }), feedback: db.feedback || [{when: ymd(addDays(today0(),-1)) + ' 21:40', phone:'9876500003', screen:'checkin', message:'Photo upload nahi ho raha'}]}; },
    adminAction({phone, action, value, confirmName}){ load(); const s = db.students.find(x => x.phone===phone); if (!s) throw new Error('Student not found.');
      if (action==='pause' || action==='resume') s.status = action==='pause' ? 'Paused' : 'Active';
      else if (action==='resetPin') s.pin = '';
      else if (action==='setParent'){ if (!/^[6-9]\d{9}$/.test(value||'')) throw new Error('Enter a valid 10-digit parent number.'); s.answers.parentPhone = value; }
      else if (action==='remove'){ if (String(confirmName||'').trim().toLowerCase() !== s.name.trim().toLowerCase()) throw new Error('The name typed does not match. Nothing was removed.'); db.students = db.students.filter(x => x !== s); }
      persist(); return {ok:true}; },
    reset(){ db = seed(); persist(); },
  };
})();

const scr = document.getElementById('screen');

const V = {screen:'gate', step:0};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} } };
const setState = s => { ST = s; M = buildModel(s); try { store.set('c12.state', JSON.stringify(s)); } catch(e){} };
const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
let toastT;
function toast(msg){ let el = document.querySelector('.toast'); if (!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }
function go(screen, opts){ if (screen !== 'week') WEEK = null; Object.assign(V, {screen}, opts||{}); render(); window.scrollTo(0,0); }
function render(){
  const r = document.getElementById('barR');
  r.innerHTML = `<button class="linkbtn" type="button" id="fbOpen">Report a problem</button>${ST && !V.screen.startsWith('mentor') ? ' · <button class="linkbtn" type="button" id="logout">Log out</button>' : ''}`;
  on('fbOpen', openFeedback);
  on('logout', () => { store.set('c12.token', null); store.set('c12.state', null); TOKEN = null; ST = null; M = null; go('gate'); });
  ({gate:renderGate, form:renderForm, home:renderHome, week:renderWeek, syl:renderSyl, checkin:renderCheckin, ciDone:renderCiDone, mentor:renderMentor}[V.screen] || renderGate)();

function openFeedback(){
  if (document.getElementById('fb')) return;
  const box = document.createElement('div'); box.id = 'fb'; box.className = 'fb';
  box.innerHTML = `<div class="fb-in" role="dialog" aria-label="Report a problem"><h3>Report a problem or suggestion</h3>
    <textarea id="fbText" placeholder="What went wrong, or what should be better?"></textarea>
    <p class="err" id="fbErr" hidden></p>
    <div class="actions"><button class="btn primary" type="button" id="fbSend">Send</button><button class="btn" type="button" id="fbClose">Close</button></div></div>`;
  document.body.appendChild(box);
  document.getElementById('fbText').focus();
  on('fbClose', () => box.remove());
  on('fbSend', () => {
    const msg = document.getElementById('fbText').value.trim(), err = document.getElementById('fbErr');
    if (!msg){ err.textContent = 'Write a few words first.'; err.hidden = false; return; }
    const b = document.getElementById('fbSend'); b.disabled = true; b.textContent = 'Sending…';
    API('feedback', {token:TOKEN||'', screen:V.screen, message:msg, phone: M ? M.phone : ''})
      .then(() => { box.remove(); toast('Sent. Thank you!'); })
      .catch(x => { err.textContent = x.message; err.hidden = false; b.disabled = false; b.textContent = 'Send'; });
  });
}

const chipGroup = (name, opts, type, checkedFn, attrs) => `<div class="chips" role="${type==='radio'?'radiogroup':'group'}">${opts.map(o=>`<label class="chip"><input type="${type}" name="${esc(name)}" value="${esc(o)}" ${attrs||''} ${checkedFn(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
// One row of small equal buttons; labels can be shortened for the eye while values stay the same.
const SEG_LABEL = {'Not started':'Not yet','Completed once':'Done once','Revision done':'Revised','Final touch done':'Final'};
const segGroup = (name, opts, checkedFn, attrs) => chipGroup(name, opts, 'radio', checkedFn, attrs)
  .replace('class="chips"', `class="chips segs" style="--n:${opts.length}"`).replace(/<span>([^<]*)<\/span>/g, (m0, t) => `<span>${SEG_LABEL[t] || t}</span>`);
function fieldHTML(f){
  const v = FA[f.id], id = 'f_'+f.id.replace(/\W/g,'_'), da = `data-f="${esc(f.id)}"`;
  const lab = `${esc(f.l)}${f.req?' <span class="req" aria-hidden="true">*</span>':''}`;
  const help = f.help ? `<p class="fhelp">${esc(f.help)}</p>` : '', err = errors[f.id] ? `<p class="err">${esc(errors[f.id])}</p>` : '';
  if (f.type==='text' || f.type==='tel') return `<div class="field"><label for="${id}">${lab}</label>${help}<input id="${id}" class="big" type="${f.type}" ${da} value="${esc(v||'')}" ${f.type==='tel'?'inputmode="numeric" maxlength="10"':''}>${err}</div>`;
  if (f.type==='pin') return `<div class="field"><label for="${id}">${lab}</label>${help}<input id="${id}" class="big pinbox" type="tel" inputmode="numeric" maxlength="4" ${da} value="${esc(v||'')}">${err}</div>`;
  if (f.type==='select') return `<div class="field"><label for="${id}">${lab}</label>${help}<select id="${id}" class="big" ${da}><option value="">Choose</option>${f.opts.map(o=>`<option ${String(v)===o?'selected':''}>${o}</option>`).join('')}</select>${err}</div>`;
  let body = '';
  if (f.type==='multi') body = chipGroup(id, f.opts, 'checkbox', o => (v||[]).includes(o), da);
  else if (f.type==='choice') body = chipGroup(id, f.opts, 'radio', o => v===o, da);
  else if (f.type==='marks') body = f.rows.map(r => { const mk = (v||{})[r] || {}, p = pctOf(mk);
    return `<div class="mrow"><span class="rl">${esc(short(r))}</span><span class="mins"><input type="text" inputmode="decimal" aria-label="${esc(r)} marks you got" placeholder="Got" ${da} data-r="${esc(r)}" data-part="s" value="${esc(mk.s||'')}"><span class="muted">out of</span><input type="text" inputmode="numeric" aria-label="${esc(r)} total marks" placeholder="Total" ${da} data-r="${esc(r)}" data-part="o" value="${esc(mk.o||'')}"><span class="pct mono">${p!=null&&p<=100?'= '+p+'%':''}</span></span></div>`; }).join('');
  else if (f.type==='chapters') body = `<button type="button" class="linkbtn tiny" data-allns="${esc(f.id)}">Mark the rest "Not yet", then change only the ones you have done</button>` + chaptersOf(f.subject, '').map((c,i) => `<div class="grow g-seg"><div class="rl" id="${id}_${i}">${esc(c.chapter)}</div>${segGroup(id+'_'+i, CH_STATUS, o => ((v||{})[c.chapter])===o, `${da} data-r="${esc(c.chapter)}" aria-labelledby="${id}_${i}"`)}</div>`).join('');
  return `<div class="field"><div class="lbl">${lab}</div>${help}${body}${err}</div>`;
}

function onFormInput(e){
  const el = e.target, id = el.dataset.f; if (!id) return;
  const f = SECTIONS.flatMap(s=>s.f).find(x=>x.id===id), r = el.dataset.r;
  if (f.type==='multi'){ const set = new Set(FA[id]||[]); el.checked ? set.add(el.value) : set.delete(el.value); FA[id] = [...set]; }
  else if (f.type==='marks'){ FA[id] = FA[id]||{}; FA[id][r] = FA[id][r]||{}; FA[id][r][el.dataset.part] = el.value.replace(/[^\d.]/g,''); const p = pctOf(FA[id][r]); el.closest('.mrow').querySelector('.pct').textContent = p!=null&&p<=100 ? '= '+p+'%' : ''; }
  else if (r){ FA[id] = FA[id]||{}; FA[id][r] = el.value; }
  else FA[id] = f.type==='pin' ? el.value.replace(/\D/g,'') : el.value;
  saveDraft();
}
function validate(sec){
  const e = {};
  sec.f.forEach(f => {
    const v = FA[f.id];
    const filled = f.type==='marks' ? f.rows.every(r => v && v[r] && v[r].s && v[r].o) : f.type==='chapters' ? chaptersOf(f.subject,'').every(c => v && v[c.chapter]) : f.type==='multi' ? (v||[]).length>0 : v!==undefined && String(v).trim()!=='';
    if (f.req && !filled) e[f.id] = f.type==='marks' ? 'Fill marks and total for every subject.' : f.type==='chapters' ? 'Tap one option for every chapter.' : 'Please answer this.';
    else if (f.type==='marks'){ const bad = f.rows.find(r => +v[r].s > +v[r].o); if (bad) e[f.id] = short(bad)+': marks cannot be more than the total.'; }
    else if (f.type==='tel' && !/^[6-9]\d{9}$/.test(v)) e[f.id] = 'Enter a 10-digit mobile number.';
    else if (f.type==='pin' && !/^\d{4}$/.test(v)) e[f.id] = 'The PIN must be 4 digits.';
  });
  if (sec.f.some(f => f.id==='parentPhone') && FA.parentPhone && FA.parentPhone===FA.phone) e.parentPhone = 'Parent number must be different from yours.';
  return e;
}

function readPhotos(files){
  return Promise.all([...files].slice(0,3).map(f => new Promise((res, rej) => {
    if (f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
      if (f.size > 4*1024*1024) return rej(new Error('This PDF is bigger than 4 MB. Send a smaller one or a photo.'));
      const fr = new FileReader(); fr.onload = () => res({name:f.name, type:'pdf', b64:String(fr.result).split(',')[1]}); fr.onerror = rej; fr.readAsDataURL(f); return;
    }
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { const s = Math.min(1, 1400/Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res({name:f.name.replace(/\.[^.]+$/,'')+'.jpg', b64:c.toDataURL('image/jpeg',.72).split(',')[1]}); };
    img.onerror = rej; img.src = url;
  })));
}

// Weekly message for the parent, in plain words. Always covers the last full week (Sunday to Saturday);
// a student who joined this week gets this week so far. Three tones: good, okay, weak.
function parentFacts(m){
  const cur = weekOf(m.t, m.joined), wk = cur.start > m.joined ? weekOf(addDays(cur.start,-1), m.joined) : cur;
  const days = eachDay(wk.start, wk.end).filter(d => d <= m.t);
  const ci = days.filter(d => m.checkins.some(c => c.date===ymd(d))).length;
  const its = m.items.filter(i => i.d>=wk.start && i.d<=wk.end && i.d<=m.t && i.min>0);
  const done = its.filter(i => i.done===true).length, f = finishInfo(m);
  const ratio = its.length ? done/its.length : 0;
  const tone = (ci <= days.length*.45 || (its.length && ratio < .3)) ? 'weak' : (ci >= days.length-1 && ratio >= .7) ? 'good' : 'okay';
  return {name:m.name.replace(/\(.*\)/,'').trim().split(' ')[0], days:days.length, ci, done, total:its.length, f, tone};
}

      ${MENTOR.map((m,i) => { const lang = getLang(m.phone), to = DASH.to[m.phone] || 'parent', tPhone = to==='student' ? m.phone : m.parentPhone, msg = (to==='student' ? studentMessage : parentMessage)(m, lang, '');
        return `<div class="pl"><div class="pl-top"><b>${esc(m.name)}</b><span class="mono muted">${to==='student' ? 'Student' : 'Parent'}: ${esc(tPhone||'—')}</span></div>
        <div class="pl-ctl">${segGroup('to_'+i, ['Parent','Student'], o => o.toLowerCase()===to, `data-to="${i}"`)}${segGroup('lg_'+i, ['Hinglish','English'], o => (o==='English') === (lang==='en'), `data-lang="${i}"`)}</div>
        <details class="pl-more"><summary>See message · add your line</summary><p class="pl-text" id="pl_${i}">${esc(msg)}</p>
        <input class="big" type="text" id="pc_${i}" data-cmt="${i}" placeholder="Your line (optional)"></details>
        <div class="actions">${tPhone ? `<a class="btn primary small" id="wa_${i}" href="https://wa.me/91${esc(tPhone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp par bhejo</a>` : ''}<button class="btn small" type="button" data-copy="${i}">Copy</button></div></div>`; }).join('')}
    </section>
    ${problemsHTML}
    ${IS_LIVE ? '' : '<button class="btn" type="button" id="toGate2">Back to start</button>'}
  </div>`;
  on('toGate2', () => go('gate'));
  on('dRefresh', () => openMentor(MENTOR_KEY, {fresh:true}));
  const search = document.getElementById('dSearch');
  search.addEventListener('input', () => { DASH.q = search.value; clearTimeout(DASH.t); DASH.t = setTimeout(() => { renderMentor(); const s2 = document.getElementById('dSearch'); s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }, 250); });
  scr.querySelectorAll('[data-df]').forEach(b => b.addEventListener('click', () => { DASH.filter = b.dataset.df; DASH.open = null; DASH.tab = 'students'; DASH.jump = !!b.dataset.jump; renderMentor(); }));
  scr.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { if (DASH.tab==='problems' && b.dataset.tab!=='problems' && FEEDBACK[0]) store.set('c12.fbSeen', FEEDBACK[0].when); DASH.tab = b.dataset.tab; renderMentor(); if (DASH.tab==='problems' && FEEDBACK[0]) store.set('c12.fbSeen', FEEDBACK[0].when); }));
  scr.querySelectorAll('[data-kpi]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.kpi;
    if (k==='all'){ DASH.filter = 'all'; DASH.panel = null; DASH.tab = 'students'; DASH.jump = true; }
    else DASH.panel = DASH.panel===k ? null : k;
    renderMentor();
  }));
  if (DASH.jump){ DASH.jump = false; const tb = scr.querySelector('.crm-table'); if (tb) tb.scrollIntoView({behavior:'smooth', block:'start'}); }
  scr.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { DASH.open = DASH.open===b.dataset.open ? null : b.dataset.open; renderMentor(); }));
  scr.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const ph = b.dataset.ph, act = b.dataset.act, err = document.getElementById('adm_'+ph);
    const args = {key:MENTOR_KEY, phone:ph, action:act};
    if (act==='setParent') args.value = document.getElementById('pp_'+ph).value.trim();
    if (act==='remove') args.confirmName = document.getElementById('rm_'+ph).value;
    const done = {pause:'Paused', resume:'Resumed', resetPin:'PIN reset. The student can log in with a new PIN.', setParent:'Parent number saved', remove:'Student removed'}[act];
    b.disabled = true; err.hidden = true;
    API('adminAction', args).then(() => { toast(done); if (act==='remove') DASH.open = null; openMentor(MENTOR_KEY, {fresh:true}); })
      .catch(x => { err.textContent = x.message; err.hidden = false; b.disabled = false; });
  }));
  const toOf = i => DASH.to[MENTOR[i].phone] || 'parent';
  const msgFor = i => (toOf(i)==='student' ? studentMessage : parentMessage)(MENTOR[i], getLang(MENTOR[i].phone), document.getElementById('pc_'+i).value.trim());
  const refresh = i => { const tx = msgFor(i); document.getElementById('pl_'+i).textContent = tx; const a = document.getElementById('wa_'+i); if (a) a.href = `https://wa.me/91${toOf(i)==='student' ? MENTOR[i].phone : MENTOR[i].parentPhone}?text=${encodeURIComponent(tx)}`; };
  // Switching Parent/Student changes the number and the button, so redraw (the details box stays open).
  scr.querySelectorAll('[data-to]').forEach(r => r.addEventListener('change', () => { DASH.to[MENTOR[r.dataset.to].phone] = r.value==='Student' ? 'student' : 'parent'; DASH.msgOpen = true; renderMentor(); }));
  scr.querySelectorAll('[data-lang]').forEach(r => r.addEventListener('change', () => { store.set('c12.lang.'+MENTOR[r.dataset.lang].phone, r.value==='English' ? 'en' : 'hi'); refresh(r.dataset.lang); }));
  scr.querySelectorAll('[data-cmt]').forEach(inp => inp.addEventListener('input', () => refresh(inp.dataset.cmt)));
  scr.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
    const i = b.dataset.copy, text = msgFor(i);
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('pl_'+i)); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected. Press Copy on your keyboard.'); };
    try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch(e){ fallback(); }
  }));
}
function studentDetail(r){
  const m = r.m, t = m.t;
  const dots = []; for (let i = 6; i >= 0; i--){ const d = addDays(t,-i), dk = ymd(d), before = d < m.joined, has = m.checkins.some(c => c.date===dk);
    dots.push(`<span class="dot7 ${before ? 'pre' : has ? 'yes' : dk===ymd(t) ? 'open' : 'no'}" title="${fmt(d)}: ${before ? 'before joining' : has ? 'checked in' : dk===ymd(t) ? 'not yet' : 'missed'}">${DAY[d.getDay()][0]}</span>`); }
  const todays = m.items.filter(i => i.date===ymd(t));
  return `<div class="sdetail">
    <div><b>Last 7 days</b><div class="dots7">${dots.join('')}</div></div>
    <div><b>Today</b>${todays.length ? todays.map(i => `<div class="tiny">${esc(short(i.subject))} · ${esc(i.chapter||'—')} · ${fmtH(i.min)}${i.done===true ? ' · <span class="st-done">Done</span>' : i.done==='partly' ? ' · <span class="st-partly">Partly</span>' : ''}</div>`).join('') : '<div class="tiny muted">No slots today</div>'}</div>
    ${r.noStudy.length ? `<div><b>Why no study (7 days)</b>${r.noStudy.map(c => `<div class="tiny">${fmt(D(c.date))}: ${esc(c.reason.replace(/^No study: /,''))}${c.doubt ? ' · ' + esc(c.doubt.replace(/^.*Why no study: /,'')) : ''}</div>`).join('')}</div>` : ''}
    <div><b>Stuck notes (7 days)</b>${r.stuck.length ? r.stuck.map(c => `<div class="tiny">${fmt(D(c.date))}: ${esc(c.doubt || 'stuck, no note')}</div>`).join('') : '<div class="tiny muted">None</div>'}</div>
    ${m.phone && reminderKinds(r).length ? `<div class="remind"><b>Send reminder</b><div class="actions">${reminderKinds(r).map(k => `<a class="btn small primary" href="${esc(waLink(m.phone, reminderText(r,k)))}" target="_blank" rel="noopener">📲 ${REMIND_LABEL[k]}</a>`).join('')}</div></div>` : ''}
    <div class="actions">${m.phone ? `<a class="btn small" href="https://wa.me/91${esc(m.phone)}" target="_blank" rel="noopener">WhatsApp student</a>` : ''}${m.parentPhone ? `<a class="btn small" href="https://wa.me/91${esc(m.parentPhone)}" target="_blank" rel="noopener">WhatsApp parent</a>` : ''}</div>
    <div class="admin"><b>Manage</b>
      <div class="actions">
        ${m.state.profile.status === 'Paused'
          ? `<button class="btn small" type="button" data-act="resume" data-ph="${esc(m.phone)}">▶ Resume</button>`
          : `<button class="btn small" type="button" data-act="pause" data-ph="${esc(m.phone)}">⏸ Pause</button>`}
        <button class="btn small" type="button" data-act="resetPin" data-ph="${esc(m.phone)}">🔑 Reset PIN</button>
      </div>
      <div class="actions"><label class="sr-only" for="pp_${esc(m.phone)}">Parent WhatsApp</label><input id="pp_${esc(m.phone)}" class="big" type="tel" inputmode="numeric" maxlength="10" value="${esc(m.parentPhone||'')}" style="max-width:170px"><button class="btn small" type="button" data-act="setParent" data-ph="${esc(m.phone)}">Save parent number</button></div>
      <details><summary class="linkbtn">🗑 Remove student</summary>
        <p class="tiny">This deletes ${esc(m.name)} and all plans and check-ins for good. Type the name to confirm: <b>${esc(m.name.trim())}</b></p>
        <div class="actions"><label class="sr-only" for="rm_${esc(m.phone)}">Type the name</label><input id="rm_${esc(m.phone)}" class="big" type="text" style="max-width:220px"><button class="btn small danger" type="button" data-act="remove" data-ph="${esc(m.phone)}">Remove</button></div></details>
      <p class="err" id="adm_${esc(m.phone)}" hidden></p>
    </div>
  </div>`;
}

// =====================================================================
// Start
// =====================================================================
function boot(params){
  if (params.view==='mentor') return openMentor(params.key || '');
  const tok = store.get('c12.token');
  if (!tok) return go('gate');
  // Show the home screen from the last saved data at once, then bring it up to date in the background.
  let cached = null; try { cached = JSON.parse(store.get('c12.state')); } catch(e){}
  if (cached && cached.profile){ TOKEN = tok; setState(cached); go('home'); }
  else scr.innerHTML = '<div class="narrow card"><p class="muted">Opening…</p></div>';
  API('resume', {token:tok}).then(r => { TOKEN = tok; setState(r.state); if (!cached || V.screen==='home') { if (V.screen==='home') render(); else go('home'); } })
    .catch(x => { if (/log in again/i.test(x.message) || !cached){ store.set('c12.token', null); store.set('c12.state', null); go('gate'); } });
}
// Auto-update: when the app opens or comes back to the screen, it checks the site's version file and
// reloads if a newer build is live. It never reloads while the student is filling the form or a check-in.
const BUILD = '1791867896375';
if (REMOTE) {
  const checkUpdate = () => fetch('/class12/version.json?ts=' + Date.now(), {cache:'no-store'}).then(r => r.json())
    .then(v => { if (v && v.build && v.build !== BUILD && !['form','checkin'].includes(V.screen)) location.reload(); }).catch(() => {});
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  setTimeout(checkUpdate, 4000);
}
if (IN_GAS && google.script.url) google.script.url.getLocation(loc => boot(loc.parameter || {}));
else if (REMOTE) boot(Object.fromEntries(new URLSearchParams(location.search)));
else boot({});
</script>
