<style>
/* Same look as the mentorship landing page: warm paper, ink, one strong blue, yellow highlight.
   The report itself sits on the deep-navy "bucket" panel from the audit video. */
:root{
  --bg:#f7f7f4; --surface:#fff; --ink:#0e1222; --ink2:#3b4054; --muted:#5b6072; --faint:#8a8fa0;
  --line:#e3e3de; --line2:#efefea; --blue:#2347d6; --blue-h:#1a37ad; --tint:#eaeefc; --yellow:#ffd23f; --soft:#fff8d9;
  --good:#1d7a45; --good-soft:#e2f4e8; --warn:#8a5a00; --warn-soft:#fdf1d8; --bad:#b4233c; --bad-soft:#fbe6ea;
  --navy:#070d24; --navy2:#0d1636; --glow:#3d6bff;
  --font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Poppins",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{font-weight:600;font-size:15px}.brand span{font-weight:300}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
h1,h2{font-family:"Poppins",var(--font)}
h1{font-size:clamp(28px,6vw,40px);font-weight:500;letter-spacing:-.035em;line-height:1.1;margin:6px 0 10px;text-wrap:balance}
h1 em{font-style:normal;background:var(--yellow);padding:0 6px;border-radius:6px;white-space:nowrap}
h2{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0 0 4px}
p{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:14px}
.steps{display:flex;gap:6px;margin:0 0 18px;overflow-x:auto}
.steps span{flex:1;min-width:58px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-top:3px solid var(--line);padding-top:6px}
.steps span i{font-style:normal}
@media (max-width:560px){.steps{overflow:visible}.steps span{min-width:0;flex:1}.steps span:not(.on) i{display:none}.steps span.on{flex:3}}
.steps span.on{color:var(--blue);border-color:var(--blue)}.steps span.done{color:var(--ink2);border-color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
label.lbl,.lbl{font-weight:600;font-size:15px}
input.big{font:inherit;font-size:17px;padding:12px 14px;border:1px solid #d4d4ce;border-radius:10px;background:#fff;color:var(--ink);width:100%}
input.big:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;border:1px solid #d4d4ce;background:#fff;color:var(--ink2);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.course{font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.course b{font-size:18px;font-weight:600}.course small{color:var(--muted)}
.course:hover{border-color:var(--blue);box-shadow:0 12px 32px rgba(14,18,34,.06)}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:10px;padding:14px 22px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(35,71,214,.25);min-height:50px}
.btn:hover{background:var(--blue-h)}.btn[disabled]{opacity:.55;cursor:default;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink2);box-shadow:none;border:1px solid #d4d4ce}
.btn.wa{background:#25d366;color:#0e1222;box-shadow:none}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:0}
.subj{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.subj summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600;background:#fbfbf9}
.subj summary::-webkit-details-marker{display:none}
.subj summary small{font-weight:400;color:var(--muted);font-size:13px}
.chrow{padding:12px 16px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
.chrow .nm{font-size:15px}.chrow .unit{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--line2);padding:3px;border-radius:10px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;border-radius:8px;padding:8px 2px;cursor:pointer;color:var(--ink2);min-height:38px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,18,34,.15)}
.seg button[aria-pressed="true"][data-v="0"]{color:var(--bad)}.seg button[aria-pressed="true"][data-v="3"]{color:var(--good)}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line2);background:#fbfbf9}
.quick .chip{font-size:13px;min-height:34px;padding:6px 10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--blue);flex:none}
.otp{font-family:var(--mono);letter-spacing:.4em;font-size:22px;text-align:center}
.note{background:var(--soft);border:1px solid #f2e09a;border-radius:10px;padding:10px 12px;font-size:14px}

/* ---------- Report: one A4 page. Navy and gold band top and bottom, mentor's name on both. ---------- */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}.list li:first-child{border-top:0}
.tag{font-size:10px;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:var(--tint);color:var(--blue);flex:none;margin-right:4px}
.num{width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.ok{width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.hrs{margin-left:auto;font-size:12px;color:var(--muted);flex:none;padding-left:8px}
.trk{height:10px;background:var(--line2);border-radius:6px;overflow:hidden}.trk i{display:block;height:100%;background:var(--blue);border-radius:6px}
.rp{--rnavy:#0b1a3a;--rnavy2:#14295a;--gold:#c9a227;--gold-soft:#f7efd2;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;color:#16213d}
.rp h3,.rp .hd{font-family:"Poppins",var(--font)}
.rp-head{background:linear-gradient(135deg,var(--rnavy),var(--rnavy2));color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:4px solid var(--gold)}
.rp-brand{display:flex;gap:12px;align-items:center}
.rp-brand img{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.rp-brand .t{font-family:"Poppins",var(--font);font-weight:700;font-size:20px;letter-spacing:.06em;line-height:1.1}
.rp-brand .s{font-size:13px;color:#d6def5}.rp-brand .s2{font-size:11.5px;color:#aebce6;letter-spacing:.02em}.rp-brand .s b{color:var(--gold);font-weight:700}
.rp-who{text-align:right;font-size:13px;color:#d6def5;line-height:1.5}.rp-who b{display:block;color:#fff;font-size:17px;font-family:"Poppins",var(--font);font-weight:600}
.rp-body{padding:16px 22px;display:flex;flex-direction:column;gap:14px}
.rp-sum{display:grid;grid-template-columns:1.05fr 1fr;gap:12px}
.rp-status{border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;background:#f4f6fb}
.rp-status svg{flex:none;width:96px;height:auto}
.rp-status.green{background:#e8f5ee}.rp-status.yellow{background:#fdf4dd}.rp-status.red{background:#fbe9ec}
.rp-status .lab{font-family:"Poppins",var(--font);font-weight:700;font-size:20px;margin:0 0 4px}
.rp-status.green .lab{color:#1d7a45}.rp-status.yellow .lab{color:#8a5a00}.rp-status.red .lab{color:#b4233c}
.rp-status p{margin:0;font-size:13.5px;line-height:1.45}
.rp-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-kpi{border:1px solid #e6e9f2;border-radius:10px;padding:9px 11px}
.rp-kpi b{display:block;font-family:"Poppins",var(--font);font-size:19px;font-weight:600;line-height:1.2}.rp-kpi span{font-size:12px;color:#5b6072}
.rp-kpi.alert b{color:#b4233c}
.rp-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rp-box{border:1px solid #e6e9f2;border-radius:12px;padding:12px 14px}
.rp-box h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--rnavy);font-weight:700;display:flex;align-items:center;gap:8px}
.rp-box h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--gold)}
.rp .list li{padding:6px 0;font-size:14px;gap:8px}
.rp .num,.rp .ok{width:20px;height:20px;font-size:11px}
.rp .tag{font-family:"Poppins",var(--font);font-size:9.5px;background:#eef1f8;color:var(--rnavy)}
.rp .hrs{font-family:"Poppins",var(--font);font-size:11.5px}
.rp-subj{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 18px}
.rp-subj .t{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:3px}.rp-subj .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rp-subj .t span{white-space:nowrap}.rp-subj .t b{font-weight:700}
.rp .trk{height:8px}.rp .trk i{background:linear-gradient(90deg,var(--rnavy2),#3d6bff)}
.rp-note{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.5}
.rp-note b.h{display:block;font-family:"Poppins",var(--font);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7a5d00;margin-bottom:2px}
.rp-quote{text-align:center;padding:4px 20px 0}
.rp-quote q{font-family:"Lora",Georgia,serif;font-style:italic;font-size:17px;color:var(--rnavy)}
.rp-quote span{display:block;font-size:12px;color:#5b6072;margin-top:2px;letter-spacing:.04em}
.rp-foot{background:var(--rnavy);color:#cdd6f0;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;line-height:1.5;border-top:3px solid var(--gold)}
.rp-foot b{color:#fff;font-family:"Poppins",var(--font);font-weight:600}
.foot{font-size:12px;color:var(--faint);text-align:center;margin:0}
.fb-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.fb-box h3{margin:0;font-family:"Poppins",var(--font);font-size:17px;font-weight:600}
textarea.big{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #d4d4ce;border-radius:10px;width:100%;resize:vertical}
.rp-actions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:600px){.rp-sum,.rp-cols{grid-template-columns:1fr}.rp-who{text-align:left}}
@media print{.rp{border:0;border-radius:0}.rp-head,.rp-foot,.rp-status,.rp-note,.rp .trk i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp-body{gap:9px;padding:12px 18px}.wrap{padding:0}
  .rp .list li{padding:4px 0;font-size:13px}.rp-status p{font-size:12.5px}.rp-note{font-size:13px;padding:8px 12px}.rp-quote q{font-size:15px}.rp-kpi{padding:7px 10px}.rp-kpi b{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}.no-print{display:none!important}.wrap{max-width:none;padding:0}
  .hero,.cta{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec,.tile,.hero{break-inside:avoid}
}
/* ---------- 4-page Study Audit Report (design from redesign.html, scoped under .r4) ---------- */
.r4{--navy:#16213E;--navy2:#24325C;--cream:#FBF6EE;--paper:#FFFFFF;--gold:#D99A2B;--gold-soft:#F7EAD0;--ink:#1E2433;--muted:#5E6577;--line:#ECE3D3;
  --good:#2F8F6B;--good-soft:#E3F3EC;--mid:#D98A1E;--mid-soft:#FBEBD2;--bad:#D4573B;--bad-soft:#FBE4DE;--acc:#3B5BDB;--bs:#8A55C4;--eco:#178F80;--test:#C2861F;--oth:#24325C;--oth2:#B0476A;
  font-family:"Plus Jakarta Sans","Inter",system-ui,sans-serif;color:var(--ink);font-size:12pt;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r4 *{box-sizing:border-box;margin:0;padding:0}
/* undo the audit page styles that share these class names */
.r4 .card{display:block;gap:0}.r4 .chip{border:0;background:none;padding:0;min-height:0;border-radius:0;cursor:default;color:inherit}.r4 .note{background:none;border:0;border-radius:0;padding:0}.r4 .foot{text-align:left}
.r4 .page{width:210mm;height:297mm;margin:0 auto 8mm;padding:13mm 14mm 0;background:var(--cream);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 30px rgba(0,0,0,.12)}
.r4 h1,.r4 h2,.r4 h3,.r4 .serif{font-family:"Fraunces",Georgia,serif;font-weight:700;letter-spacing:-.01em}
.r4 h2{font-size:24pt;line-height:1.1;color:var(--navy)}
.r4 h3{font-size:15pt;color:var(--navy)}
.r4 .eyebrow{font-size:9.5pt;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.r4 .muted{color:var(--muted)}
.r4 .card{background:var(--paper);border:1px solid var(--line);border-radius:5mm;padding:6mm}
.r4 .sec-head{margin-bottom:5mm}.r4 .sec-head p{font-size:12pt;color:var(--muted);margin-top:1.5mm}
.r4 .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7mm}
.r4 .brand{display:flex;align-items:center;gap:3mm}
.r4 .mark{width:10mm;height:10mm;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;font-size:12pt;overflow:hidden}
.r4 .mark img{width:100%;height:100%;object-fit:cover}
.r4 .brand b{display:block;font-size:11pt;color:var(--navy)}.r4 .brand span{font-size:9pt;color:var(--muted)}
.r4 .pg{font-size:9.5pt;color:var(--muted);font-weight:600}
.r4 .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:4mm 0 6mm;font-size:9pt;color:var(--muted)}
.r4 .tag{display:inline-block;font-size:8.5pt;font-weight:800;letter-spacing:.06em;padding:.6mm 2.2mm;border-radius:2mm;color:#fff;vertical-align:middle;white-space:nowrap;background:var(--c)}
.r4 .s-acc{--c:var(--acc)}.r4 .s-bs{--c:var(--bs)}.r4 .s-eco{--c:var(--eco)}.r4 .s-test{--c:var(--test)}.r4 .s-other{--c:var(--oth)}.r4 .s-other2{--c:var(--oth2)}
.r4 .pill{display:inline-flex;align-items:center;gap:2mm;font-weight:800;font-size:11pt;padding:1.6mm 4mm;border-radius:10mm}
.r4 .pill i{width:2.6mm;height:2.6mm;border-radius:50%;background:currentColor;display:inline-block}
.r4 .st-tight .pill{background:var(--mid-soft);color:#9A5A00}.r4 .st-behind .pill{background:var(--bad-soft);color:#A3321A}.r4 .st-ok .pill{background:var(--good-soft);color:#1E6B4F}
/* page 1 */
.r4 .cover-hero{background:var(--navy);color:#fff;border-radius:6mm;padding:9mm 9mm 8mm;position:relative;overflow:hidden}
.r4 .cover-hero:after{content:"";position:absolute;right:-30mm;top:-30mm;width:90mm;height:90mm;border-radius:50%;background:radial-gradient(circle,rgba(217,154,43,.35),rgba(217,154,43,0) 70%)}
.r4 .cover-hero .eyebrow{color:#F1C774}
.r4 .cover-hero h1{font-size:38pt;line-height:1.02;margin:3mm 0 2.5mm}
.r4 .cover-hero .meta{font-size:12pt;color:#C9D0E4}.r4 .cover-hero .meta b{color:#fff}
.r4 .verdict{margin-top:6mm;background:#fff;color:var(--ink);border-radius:4mm;padding:5mm 6mm;position:relative;z-index:1}
.r4 .verdict p{font-family:Fraunces,serif;font-size:15pt;line-height:1.25;margin-top:3mm;color:var(--navy)}
.r4 .cover-grid{display:grid;grid-template-columns:72mm 1fr;gap:5mm;margin-top:6mm}
.r4 .gauge{text-align:center;padding:5mm 4mm}.r4 .gauge svg{width:100%;height:auto;display:block}
.r4 .gauge .big{font-family:Fraunces,serif;font-size:40pt;font-weight:700;color:var(--navy);line-height:1;margin-top:-17mm}
.r4 .gauge .lbl{font-weight:700;font-size:12pt;margin-top:1mm}.r4 .gauge .sub{font-size:10pt;color:var(--muted);margin-top:2mm}
.r4 .stats{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.r4 .stat{padding:4.5mm 5mm}
.r4 .stat .n{font-family:Fraunces,serif;font-size:24pt;font-weight:700;color:var(--navy);line-height:1}.r4 .stat .n small{font-size:13pt}
.r4 .stat .k{font-size:10.5pt;font-weight:700;margin-top:1.5mm}.r4 .stat .d{font-size:9.5pt;color:var(--muted)}
.r4 .stat.warn .n{color:#B56A00}
.r4 .timeline{margin-top:5mm;padding:6mm 7mm 7mm}
.r4 .tl{position:relative;height:30mm;margin:2mm 2mm 0}
.r4 .tl .bar{position:absolute;left:0;right:0;top:14mm;height:3.2mm;border-radius:2mm;background:linear-gradient(90deg,#C9D2EA,#8EA0D4)}
.r4 .tl .rev{position:absolute;top:13.2mm;height:4.8mm;border-radius:2mm;background:repeating-linear-gradient(45deg,var(--mid),var(--mid) 1.4mm,#F2B65A 1.4mm,#F2B65A 2.8mm);left:calc(var(--f) * 1%);right:0}
.r4 .tl .pt{position:absolute;transform:translateX(-50%);text-align:center;font-size:9.5pt;line-height:1.2;white-space:nowrap}.r4 .tl .pt b{display:block;font-size:10.5pt}
.r4 .tl .dot{position:absolute;top:12.6mm;width:6mm;height:6mm;border-radius:50%;background:#fff;border:1.6mm solid var(--navy);transform:translateX(-50%)}
.r4 .tl .up{bottom:19mm}.r4 .tl .down{top:21mm}.r4 .tl .edge-l{transform:none}.r4 .tl .edge-r{transform:translateX(-100%);text-align:right}
.r4 .tl .pt .tgt{display:block;font-size:8.5pt;color:#6b6f80}
.r4 .tl-note{font-size:11pt;margin-top:1mm}.r4 .tl-note b{color:#9A5A00}
/* page 2 */
.r4 .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
.r4 .ring{text-align:center;padding:5mm 3mm}.r4 .ring svg{width:30mm;height:30mm;display:block;margin:0 auto}

function compute(){
  const list = C().syl.map(c => Object.assign({}, c, {v: A.ch[chKey(c)] ?? 0}));
  const total = list.reduce((x,c) => x + c.base*LEFT[0], 0), left = list.reduce((x,c) => x + c.base*LEFT[c.v], 0);
  const pct = total ? Math.round((1 - left/total)*100) : 0;
  const num = s => s === '10+' ? 10 : Number(s) || 0;
  const haveWeek = Math.round((num(A.wd)*6 + num(A.sun)) * .8);   // 80%: real life takes some days away
  const exam = examDate(), daysLeft = Math.max(0, dayDiff(D0, exam));
  const weeksNeeded = haveWeek ? left / haveWeek : Infinity;
  const finish = isFinite(weeksNeeded) ? new Date(D0.getTime() + Math.ceil(weeksNeeded*7)*86400000) : null;
  const target = targetDate(), buffer = finish ? dayDiff(finish, exam) : -999, early = finish ? dayDiff(finish, target) : -999;
  const status = left === 0 ? {key:'green', label:'Fully prepared', icon:'🟢'} : early >= 0 ? {key:'green', label:'On track', icon:'🟢'} : buffer >= 0 ? {key:'yellow', label:'No safety margin', icon:'🟡'} : {key:'red', label:'Behind schedule', icon:'🔴'};
  const needWeek = Math.ceil(left / Math.max(1, dayDiff(D0, target) / 7));
  // Spread across subjects: the best pick from every subject first, then the next best, up to 6 lines.
  const spread = (items, cmp, max) => {
    const by = {}, order = [...new Set(list.map(c => c.subject))], out = [];
    items.slice().sort(cmp).forEach(c => (by[c.subject] = by[c.subject] || []).push(c));
    for (let round = 0; out.length < max && order.some(s => (by[s]||[]).length > round); round++)
      order.forEach(s => { const c = (by[s]||[])[round]; if (c && out.length < max) out.push(c); });
    return out.sort((a,b) => order.indexOf(a.subject) - order.indexOf(b.subject));
  };
  const gaps = spread(list.filter(c => c.v <= 1), (a,b) => a.v - b.v || (a.kind==='num' ? 0 : 1) - (b.kind==='num' ? 0 : 1) || b.base - a.base, 6)
    .map(c => Object.assign(c, {hrs: Math.max(1, Math.round(c.base*LEFT[c.v]))}));
  const strong = spread(list.filter(c => c.v >= 2), (a,b) => b.v - a.v || b.base - a.base, 6);
  const holes = list.filter(c => c.v <= 1).length;
  const subjects = [...new Set(list.map(c => c.subject))].map(s => { const cs = list.filter(c => c.subject===s), t = cs.reduce((x,c)=>x+c.base*LEFT[0],0), l = cs.reduce((x,c)=>x+c.base*LEFT[c.v],0);
    return {s, pct: t ? Math.round((1-l/t)*100) : 0, holes: cs.filter(c => c.v <= 1).length, n: cs.length}; });
  const finishTxt = left === 0 ? 'Done' : finish ? fmtD(finish) : '—';
  return {list, pct, left: Math.round(left), haveWeek, needWeek, exam, target, early, daysLeft, finish, finishTxt, buffer, status, gaps, strong, holes, subjects};
}

  return {R, examShort, first, st, stLabel, verdict, exam, examTxt, target, finishTxt, revision, boostRevision, today,
    pos: R.left === 0 ? 4 : !R.finish || R.buffer < 0 ? 96 : Math.max(4, Math.min(92, Math.round(daysToFinish / Math.max(1, R.daysLeft) * 100))),
    margin: R.haveWeek === R.needWeek ? 'just enough' : R.haveWeek > R.needWeek ? `${R.haveWeek - R.needWeek} h to spare` : `${R.needWeek - R.haveWeek} h short`,
    subjects, byRisk, riskCallout, strengths, pri, priTotal, priWeeks, split, fixes: fixes.slice(0, 3), parent, note,
    many: subjects.length > 3, waLink: `https://wa.me/${R4.waNumber}?text=${encodeURIComponent(waText)}`,
    price: C().attempts ? `till your ${A.attempt || 'next'} attempt` : 'till your board exams',
    examLabel: C().attempts ? (C().label + ' exams') : (A.course === 'c11' ? 'Annual exams' : 'Board exams')};
}
function renderReport(){
  const D = report4Data(), R = D.R, name = esc(A.name || ''), course = esc(C().label + (A.attempt ? ' · ' + A.attempt : '')), date = fmtD(new Date(A.when || Date.now()));
  const brand = (who, sub) => `<div class="brand"><div class="mark"><img src="/favicon.png" alt=""></div><div><b>${who}</b><span>${sub}</span></div></div>`;

  const tag = (cls, code) => `<span class="tag ${cls}">${esc(code)}</span>`;
  app.innerHTML = `<div class="fade">
  <div class="r4" id="r4">
  <section class="page st-${D.st}">

    <div class="cover-grid">

        <path d="M20 110 A90 90 0 0 1 200 110" fill="none" stroke="url(#g1)" stroke-width="20" stroke-linecap="round" pathLength="100" stroke-dasharray="${R.pct} 100"/>

      <div class="stats">
        <div class="card stat"><div class="n">${R.daysLeft} <small>days</small></div><div class="k">Until your exam</div><div class="d">${esc(D.examTxt)}</div></div>
        <div class="card stat warn"><div class="n">${D.revision} <small>days</small></div><div class="k">Left for revision</div><div class="d">after you finish on ${esc(D.finishTxt)}</div></div>
        <div class="card stat"><div class="n">${R.haveWeek}<small> / ${R.needWeek} h</small></div><div class="k">Study hours per week</div><div class="d">yours / needed · ${D.margin}</div></div>
        <div class="card stat"><div class="n">${R.holes}</div><div class="k">Chapters to fix</div><div class="d">Top ${D.pri.length} are on page 3</div></div>
      </div></div>
    <div class="card timeline"><div class="eyebrow">Your road to ${D.examShort}</div>
      <div class="tl" style="--f:${D.pos}"><div class="bar"></div><div class="rev"></div>
        <div class="dot" style="left:0"></div><div class="dot" style="left:${D.pos}%;border-color:var(--mid)"></div><div class="dot" style="left:100%;border-color:var(--bad)"></div>
        <div class="pt up edge-l" style="left:0"><b>Today</b>${shortD(D.today)}</div>
        <div class="pt ${D.pos < 28 ? 'down edge-l' : D.pos > 68 ? 'up edge-r' : 'up'}" style="left:${D.pos}%"><b>You finish</b>${R.finish ? shortD(R.finish) : '—'}<span class="tgt">target ${shortD(D.target)}</span></div>
        <div class="pt down edge-r" style="left:100%"><b>Exam</b>${D.examShort}</div>
        ${D.pos >= 28 && D.pos <= 55 ? `<div class="pt down edge-l rev-l" style="left:calc(${D.pos}% + 2mm)"><b style="color:#9A5A00">Revision: ${plural(D.revision, 'day')} →</b></div>` : ''}</div>
      <p class="tl-note">At your current pace, revision gets only the <b>last ${plural(D.revision, 'day')}</b>. Page 3 shows how to get <b>${plural(D.boostRevision, 'day')}</b>.</p></div>
    ${foot('Prepared by CA Mahendra Shekhawat · 15+ years of experience', 'camahendrashekhawat.com')}
  </section>

  <section class="page${D.many ? ' many' : ''}">
    <div class="top">${brand('CA Mahendra Shekhawat', '15+ years of experience · 22K+ YouTube subscribers')}<div class="pg">Student: ${name} · 2/4</div></div>
    <div class="sec-head"><div class="eyebrow">Subject health check</div><h2>Where you stand, subject by subject</h2><p>Readiness = how much of each subject you told us is ready.</p></div>
    <div class="rings">${D.subjects.map(s => `<div class="card ring ${s.tone}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#F1ECE2" stroke-width="12"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="var(--tc)" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="${s.pct} 100" transform="rotate(-90 50 50)"/>
      <text x="50" y="58" text-anchor="middle" class="pc" fill="#16213E">${s.pct}%</text></svg><h3>${esc(D.many ? short(s.s) : s.s)}</h3><span class="t ${s.tone}">${s.toneLabel}</span><div class="w">${plural(s.holes, 'weak chapter')}</div></div>`).join('')}</div>
    <div class="card risk"><h3>Where your marks are at risk</h3><p class="muted" style="font-size:10.5pt;margin:1mm 0 2mm">Bar = part of the subject not ready yet (100% − readiness)</p>
      ${D.byRisk.map(s => `<div class="risk-row ${s.tone}"><div class="nm">${esc(D.many ? short(s.s) : s.s)}</div><div class="track"><div class="fill" style="--p:${100 - s.pct}">${100 - s.pct}%</div></div><div class="wk"><b>${s.holes}</b> weak chapters</div></div>`).join('')}
      <div class="callout">${esc(D.riskCallout)}</div></div>
    <div class="card strengths"><h3 style="color:#1E6B4F">Already strong: keep these warm</h3>
      <div class="chips">${D.strengths.length ? D.strengths.map(c => `<div class="chip"><span class="ck">✓</span><span>${tag(c.cls, c.code)} ${esc(c.chapter)}</span></div>`).join('') : '<div class="chip"><span class="ck">✓</span><span>None yet. Your first strong chapter comes this week.</span></div>'}</div></div>
    <p class="note">You told us you are strong in these chapters. One quick revision a week is enough; spend new hours on the weak list.</p>
    ${foot('camahendrashekhawat.com', name + ' · ' + date)}
  </section>

  <section class="page">
    <div class="top">${brand('CA Mahendra Shekhawat', '15+ years of experience · 22K+ YouTube subscribers')}<div class="pg">Student: ${name} · 3/4</div></div>
    <div class="sec-head"><div class="eyebrow">Priority chapters</div><h2>Fix these ${D.pri.length} first</h2><p>Bar = estimated study hours (for an average student).</p></div>
    <div class="card" style="padding:3mm 6mm">${D.pri.length ? D.pri.map(p => `<div class="pc-row ${p.cls}"><div class="rank">${p.rank}</div><div class="ch">${tag(p.cls, p.code)}${esc(p.chapter)}</div><div class="hbar"><div class="b" style="--p:${p.bar}"></div><span>~${p.hours} h</span></div></div>`).join('') : '<p style="padding:3mm 0">No weak chapters. Keep testing yourself.</p>'}</div>
    ${D.pri.length ? `<div class="card split"><h3>~${D.priTotal} hours in total ≈ ${D.priWeeks} week${D.priWeeks===1?'':'s'} at your ${R.haveWeek} h/week</h3>
      <div class="stack">${D.split.map(x => `<div class="${x.cls}" style="--p:${x.share}">${x.share >= 8 ? x.share + '%' : ''}</div>`).join('')}</div>
      <div class="legend">${D.split.map(x => `<span class="${x.cls}"><i></i>${esc(x.s)} · ${x.hours} h</span>`).join('')}</div></div>` : ''}
    <div class="fixes"><div class="eyebrow" style="margin-top:1mm">Your top 3 fixes</div>
      ${D.fixes.map((f, i) => `<div class="card fix"><div class="num">${i + 1}</div><div><h3>${esc(f.title)}</h3><p>${esc(f.body)}</p></div></div>`).join('')}</div>
    ${foot('camahendrashekhawat.com', 'Hours are estimates, not a prediction of marks')}
  </section>

  <section class="page">
    <div class="top">${brand('CA Mahendra Shekhawat', '15+ years of experience · 22K+ YouTube subscribers')}<div class="pg">Student: ${name} · 4/4</div></div>
    <div class="parent"><div class="eyebrow" style="color:var(--navy)">For parents · 1-minute summary</div>
      <dl>${D.parent.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
    <div class="teacher"><div class="photo"><img src="/favicon.png" alt="CA Mahendra Shekhawat"></div>
      <div><div class="eyebrow">A note from your teacher</div><p class="q" style="margin-top:2mm">${esc(D.note)}</p>
        <div class="who"><b>CA Mahendra Shekhawat</b><br>Commerce mentor · 15+ years of experience</div></div></div>
    <div class="cta"><div><div class="eyebrow" style="color:#F1C774">Next step</div><h2>Talk to us on WhatsApp</h2>
      <p>Send us a message. We will go through this report with you and your parents and tell you what to do next. No pressure.</p>
      <a class="wa" href="${D.waLink}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#0B2E17"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.6 2.1 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>WhatsApp ${R4.waDisplay}</a>
      <div class="offer">${offerFor(A.course).map(o => `<div>${esc(o)}</div>`).join('')}</div>
      <div class="price">Full mentorship: <b>${({cafc:"₹5,999",cainter:"₹6,999"})[A.course] || "₹4,999"}</b> · one fee ${D.price}.</div></div>
      <div><div class="qr" id="r4qr"></div><div class="qr-cap">Scan to message us</div></div></div>
    <p class="method"><b>How this report was made:</b> from the answers ${esc(D.first)} gave in the audit on ${date}. Readiness is self-reported, chapter hours are estimates for an average student, and finish dates assume the same weekly hours. It is a study-planning guide, not a prediction of marks.</p>
    ${foot('CA Mahendra Shekhawat · 15+ years of experience · 22K+ YouTube subscribers', 'camahendrashekhawat.com')}
  </section>
  </div>
  ${feedbackAndActions(D)}
  </div>`;
  try { if (window.QRCode) new QRCode(document.getElementById('r4qr'), {text: D.waLink, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M}); } catch(e){}
  wireReportActions(D);
}

// Under the report (screen only): feedback box and buttons.
function feedbackAndActions(D){
  if (VIEW) return `<div class="no-print rp-actions" style="max-width:210mm;margin:0 auto">
      <button class="btn" type="button" id="pdf">⬇ Download PDF (4 pages)</button>
      <a class="btn wa" href="${D.waLink}" target="_blank" rel="noopener">Discuss my report on WhatsApp</a>
      <a class="btn ghost" href="${esc(joinUrl())}">Join the mentorship →</a>
      <a class="btn ghost" href="/audit/">Take your own free audit</a></div>`;
  return `<div class="no-print" style="display:flex;flex-direction:column;gap:14px;max-width:210mm;margin:0 auto">
    <section class="fb-box" aria-label="Your feedback on the report">
      <h3>How does your report feel?</h3>
      <p class="muted small">Every student is different. Tell us, and we will fine-tune your report.</p>
      <div class="chips" role="group">${[['spot','👍 Spot on'],['off','🤔 Something looks different'],['talk','💬 I want to discuss it']].map(([k,l]) => `<button type="button" class="chip" data-fb="${k}" aria-pressed="${FB.kind===k}">${l}</button>`).join('')}</div>
      <div id="fbMore" ${FB.kind && FB.kind !== 'spot' && !FB.sent ? '' : 'hidden'}>
        <label class="lbl" for="fbText" style="display:block;margin:10px 0 6px">${FB.kind==='talk' ? 'What would you like to discuss?' : 'What looks different from your real preparation?'}</label>
        <textarea id="fbText" class="big" rows="3" maxlength="600" placeholder="For example: Accounts is better than this, I have finished 2 more chapters.">${esc(FB.text||'')}</textarea>
        <button class="btn" type="button" id="fbSend" style="margin-top:8px">Send to CA Mahendra Shekhawat's team</button>
      </div>
      <p class="small" id="fbMsg" role="status" ${FB.sent ? '' : 'hidden'}>${FB.sent ? (FB.kind==='spot' ? 'Thank you! Glad the report is spot on. 🙌' : 'Thank you! Our team will look at your report and reply on WhatsApp.') : ''}</p>
      <p class="err" id="fbErr" hidden></p>
    </section>
    <div class="rp-actions">
      <button class="btn" type="button" id="pdf">⬇ Download PDF (4 pages)</button>
      <a class="btn wa" href="${D.waLink}" target="_blank" rel="noopener">Discuss my report on WhatsApp</a>
      <a class="btn ghost" href="${esc(joinUrl())}">Join the mentorship →</a>
      <button class="btn ghost" type="button" id="redo">Redo the audit</button>
    </div></div>`;
}
function wireReportActions(D){
  document.getElementById('pdf').addEventListener('click', () => window.print());
  if (VIEW) return;
  const fbSend = (kind, text) => { const e = document.getElementById('fbErr'); e.hidden = true;
    return api('auditFeedback', {phone: A.phone, name: A.name, course: C().label, kind, text: text || '', status: D.stLabel, syllabus: D.R.pct + '%'})
      .then(() => { FB.sent = true; FB.kind = kind; FB.text = text || ''; save(); renderReport(); })
      .catch(x => { e.textContent = x.message; e.hidden = false; }); };
  app.querySelectorAll('[data-fb]').forEach(b => b.addEventListener('click', () => {
    FB.kind = b.dataset.fb; FB.sent = false; save();
    if (FB.kind === 'spot') return fbSend('spot');
    renderReport(); const t = document.getElementById('fbText'); if (t) t.focus(); }));
  const sendBtn = document.getElementById('fbSend');
  if (sendBtn) sendBtn.addEventListener('click', () => { const t = document.getElementById('fbText').value.trim(); FB.text = t;
    if (!t) { const e = document.getElementById('fbErr'); e.textContent = 'Write a few words so we know what to check.'; e.hidden = false; return; }
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…'; fbSend(FB.kind, t).finally(() => { if (document.body.contains(sendBtn)) { sendBtn.disabled = false; sendBtn.textContent = "Send to CA Mahendra Shekhawat's team"; } }); });
  document.getElementById('redo').addEventListener('click', () => { A.done = false; Object.keys(FB).forEach(k => delete FB[k]); STEP = 4; render(); });
}

const short = s => (C().short || {})[s] || s;
if (RID) {
  VIEW = true;
  app.innerHTML = '<div class="card"><p class="muted">Opening the report…</p></div>';
  api('auditReport', {id: RID}).then(r => {
    const a = (r && r.answers) || {};
    if (!COURSES[a.course]) throw new Error('This report could not be opened.');
    A = Object.assign({}, a, {done: true}); STEP = 6; render();
  }).catch(x => { app.innerHTML = '<div class="card"><h2>Report not found</h2><p class="muted">' + esc(x.message) + '</p><p><a class="btn" href="/audit/">Take the free study audit</a></p></div>'; });
} else render();
</script>
