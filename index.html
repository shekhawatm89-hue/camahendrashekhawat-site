<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA Mahendra Shekhawat</title>
<meta name="description" content="CA Mahendra Shekhawat. Launching soon.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta property="og:title" content="CA Mahendra Shekhawat">
<meta property="og:description" content="Launching soon.">
<meta property="og:image" content="https://camahendrashekhawat.com/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* One screen: photo, name, launching soon. Same ink-and-margin look as the student app. */
:root{--paper:#f3f6fc;--ink:#18264a;--muted:#5f6b86;--accent:#2445a8;--margin:#d4405a;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0b1120;--ink:#e4e9f5;--muted:#9aa6c2;--accent:#93a9ff;--margin:#ff7d93;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
main{min-height:100%;max-width:880px;margin:0 auto;padding:32px 16px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:center}
@media (max-width:700px){main{grid-template-columns:minmax(0,1fr);text-align:center;align-content:center}main picture{order:-1;justify-self:center}main picture img{max-width:220px}}
.eyebrow{font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--margin);font-weight:700}
h1{font-family:var(--f-display);font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.02;margin:10px 0 14px;text-wrap:balance}
.soon{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.25rem;color:var(--accent)}
.soon::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--margin);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.soon::before{animation:none}}
p{color:var(--muted);margin:12px 0 0;max-width:40ch}
@media (max-width:700px){p{margin-inline:auto}}
img{width:100%;max-width:320px;height:auto;display:block;border-bottom:3px solid var(--margin)}
</style>
</head>
<body>
<main>
  <div>
    <div class="eyebrow">Mahendra Sir</div>
    <h1>CA Mahendra Shekhawat</h1>
    <span class="soon">Launching soon</span>
    <p>Something new for Commerce and CA students is on its way.</p>
  </div>
  <picture>
    <source srcset="/assets/mahendra-sir.webp" type="image/webp">
    <img src="/assets/mahendra-sir.png" alt="CA Mahendra Shekhawat" width="360" height="657">
  </picture>
</main>
</body>
</html>
